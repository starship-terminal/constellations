name: Research app
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      # The app reads these at runtime and in its tests, and the media
      # taxonomy seed is built from them.
      - 'systems/**'
      - 'catalog.json'
      - 'refero/catalog.json'
      - 'tools/catalog.py'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
      - 'systems/**'
      - 'catalog.json'
      - 'refero/catalog.json'
      - 'tools/catalog.py'
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10.10.0
      - name: Install locked dependencies
        run: pnpm --dir app install --frozen-lockfile
      - name: Formatting
        run: pnpm --dir app format:check
      - name: Media taxonomy seed is current
        run: python3 app/scripts/build-media-taxonomy.py --check
      - name: Generate Next types
        # next-env.d.ts and the route types are generated, not committed.
        run: pnpm --dir app exec next typegen
      - name: Typecheck
        run: pnpm --dir app typecheck
      - name: Test data, persistence and research contracts
        run: pnpm --dir app test
      - name: Production build
        run: pnpm --dir app build
