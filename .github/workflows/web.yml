# Typecheck and build the gallery app (web/) whenever it or the data it reads
# changes. The build prerenders pages from web/data/, so the job generates it
# first with tools/catalog.py. Checkout skips Git LFS smudge, so the
# thumbnails fall back to the screenshot paths, which the build does not read.
name: Web
on:
  # tools/catalog.py build reads the catalog, the packages, the refero store and
  # tools/refero/refero_media.py; the app reads systems/, scorecard/ and docs/ at
  # build and request time, and web/lib/request-guard.test.ts reads the shared
  # server/front-door-cases.json. A change to any of them can break the job.
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'catalog.json'
      - 'tools/catalog.py'
      - 'tools/refero/refero_media.py'
      - 'refero/**'
      - 'systems/**'
      - 'scorecard/**'
      - 'docs/**'
      - 'server/front-door-cases.json'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'catalog.json'
      - 'tools/catalog.py'
      - 'tools/refero/refero_media.py'
      - 'refero/**'
      - 'systems/**'
      - 'scorecard/**'
      - 'docs/**'
      - 'server/front-door-cases.json'
permissions:
  contents: read
# Replaces a pull request's older run on a new push; see the note in check.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install -g pnpm@10.10.0
      - name: Install locked dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck
        run: npx --prefix web tsc --noEmit -p web
      - name: Unit tests
        run: pnpm --dir web test
      - name: Generate web/data
        run: python3 tools/catalog.py build
      - name: Production build
        run: pnpm --dir web build
