# Build the docs site (home, scorecard, library docs), encrypt every page with
# StatiCrypt, and publish to GitHub Pages. The gallery shows the captures, so it
# only ever runs in the local Next.js app (web/); tools/site.py never emits it.
# `make check` runs first so a commit missing `make brief`
# or `make grade` fails the deploy visibly instead of shipping stale content.
name: Pages
on:
  push:
    branches: [main]
    paths: [docs/**, scorecard/**, catalog.json, systems/**, Makefile, tools/*.py,
            requirements.txt, .staticrypt.json, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, scorecard/**, catalog.json, systems/**, Makefile, tools/*.py,
            requirements.txt, .staticrypt.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Deploys from main queue one at a time and are never cancelled. A pull request's
# build gets its own group, so PR builds no longer cancel each other's queued
# runs (only one pending run per group survives) and a newer push supersedes it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The site's own icons are Git LFS objects; without this they ship as
      # pointer text. Only docs/assets/: the captures never publish.
      - name: Fetch the site's icons from Git LFS
        run: git lfs pull --include="docs/assets/**"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Freshness gates (catalog, Brief, scorecard shape, scripted grades, Health)
        run: make check
      - run: pip install -r requirements.txt
      - name: Test the scorecard generator
        run: python3 -m unittest tools/test_scorecard.py
      - name: Generate the scorecard pages
        run: python3 tools/scorecard.py
      - name: Build
        run: python3 tools/site.py
      - name: Drop the gallery and check nothing readable leaks outside the HTML
        run: |
          rm -rf site/gallery
          # site.py writes no search index or sitemap (both would list page text
          # or URLs outside the encryption); fail if one ever appears.
          if [ -e site/search.json ] || [ -e site/sitemap.xml ] || [ -e site/sitemap.xml.gz ]; then
            echo "::error::site/ has a search index or sitemap; tools/site.py must not emit one"; exit 1
          fi
          if grep -rl --include='*.png' --include='*.ico' '^version https://git-lfs' site/assets; then
            echo "::error::Git LFS pointers in site/assets (listed above)"; exit 1
          fi
      - name: Encrypt every page
        if: github.event_name != 'pull_request'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Add the STATICRYPT_PASSWORD repository secret (gh secret set STATICRYPT_PASSWORD -R c-wenlong/design-systems)"; exit 1
          fi
          npx -y staticrypt@3.5.4 site -r -d encrypted --remember 30 \
            --template-title "Design systems" \
            --template-instructions "Enter the password to view the design-systems docs." \
            --template-color-primary "#1d9e75" --template-color-secondary "#1f2125"
          # Every page must come out encrypted, not just the three phrases this used
          # to grep for. Assets (docs/assets PNG, JS, CSS) are copied as-is by design.
          # grep -q per file: grep -L's exit status depends on the other files, and
          # a page grep cannot read (status 2) is listed as unencrypted too.
          unencrypted=""
          while IFS= read -r -d '' page; do
            grep -q staticryptEncryptedMsgUniqueVariableName "$page" || unencrypted+="$page"$'\n'
          done < <(find encrypted/site -type f \( -name '*.html' -o -name '*.htm' \) -print0)
          if [ -n "$unencrypted" ]; then
            echo "::error::Pages without StatiCrypt encryption:"; echo "$unencrypted"; exit 1
          fi
          src=$(find site -type f \( -name '*.html' -o -name '*.htm' \) | wc -l)
          out=$(find encrypted/site -type f \( -name '*.html' -o -name '*.htm' \) | wc -l)
          if [ "$src" -ne "$out" ]; then
            echo "::error::site/ has $src pages but encrypted/site/ has $out"; exit 1
          fi
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: encrypted/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
