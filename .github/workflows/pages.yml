# Build the docs site (home, scorecard, library docs), encrypt every page with
# StatiCrypt, and publish to GitHub Pages. The gallery shows the captures, so it is
# removed before publishing; it runs locally only.
# Adapted from Zensical's official workflow (https://zensical.org/docs/publish-your-site/).
name: Pages
on:
  push:
    branches: [main]
    paths: [docs/**, scorecard/**, tools/scorecard.py, tools/test_scorecard.py, requirements.txt, .staticrypt.json, .github/workflows/pages.yml]
  pull_request:
    paths: [docs/**, scorecard/**, tools/scorecard.py, tools/test_scorecard.py, requirements.txt, .staticrypt.json, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements.txt
      - name: Test the scorecard generator
        run: python3 -m unittest tools/test_scorecard.py
      - name: Generate the scorecard pages and zensical.toml
        run: python3 tools/scorecard.py
      - name: Build
        run: zensical build --clean --strict
      - name: Drop the gallery and check nothing readable leaks outside the HTML
        run: |
          rm -rf site/gallery
          python3 - <<'PY'
          import json, sys
          items = json.load(open("site/search.json"))["items"]
          sys.exit(f"search index has {len(items)} entries; every page must be excluded") if items else print("search index empty")
          PY
          rm -f site/sitemap.xml site/sitemap.xml.gz
      - name: Encrypt every page
        if: github.event_name != 'pull_request'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Add the STATICRYPT_PASSWORD repository secret (gh secret set STATICRYPT_PASSWORD -R c-wenlong/design-systems)"; exit 1
          fi
          npx -y staticrypt@3.5.4 site -r -d encrypted --remember 30 \
            --template-title "Design systems" \
            --template-instructions "Enter the password to view the design-systems docs." \
            --template-color-primary "#1d9e75" --template-color-secondary "#1f2125"
          if grep -rlq -e "graded against" -e "Criteria and method" -e "five layers" encrypted/site; then
            echo "::error::Readable page text found after encryption"; exit 1
          fi
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: encrypted/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
