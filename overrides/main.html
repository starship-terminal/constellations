{#- The site's web app basics: manifest, touch icon and browser colours. The favicon
    itself is theme.favicon in zensical.toml (written by tools/scorecard.py). -#}
{% extends "base.html" %}
{% block extrahead %}
  <link rel="manifest" href="{{ base_url }}/site.webmanifest">
  <link rel="apple-touch-icon" href="{{ base_url }}/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090a">
  <meta name="apple-mobile-web-app-title" content="Design">
  <script>
    /* The gallery stores its toggle as localStorage["ds-theme"] ("dark"/"light").
       Adopt it here when the palette has never been set on the docs pages, so a
       theme picked in the gallery carries over. Once the palette toggle is used
       it writes __palette, which then wins. Values mirror the palette block in
       zensical.toml (generated by tools/scorecard.py). */
    try {
      if (!__md_get("__palette")) {
        var dst = localStorage.getItem("ds-theme");
        var opt = {
          dark:  { media: "(prefers-color-scheme: dark)",  scheme: "slate",   primary: "black", accent: "indigo" },
          light: { media: "(prefers-color-scheme: light)", scheme: "default", primary: "white", accent: "indigo" }
        }[dst];
        if (opt) __md_set("__palette", { color: opt });
      }
    } catch (e) {}
  </script>
{% endblock %}
