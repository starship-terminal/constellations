<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design systems</title>
<link rel="stylesheet" href="style.css">
<script>
  try { const t = localStorage.getItem('ds-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="bar">
  <a class="brand" href="#/">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="1" y="1" width="7" height="7" rx="2"/><rect x="10" y="1" width="7" height="7" rx="3.5"/><rect x="1" y="10" width="7" height="7" rx="3.5"/><rect x="10" y="10" width="7" height="7" rx="2"/></svg>
    <span>Design systems</span>
  </a>
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search name, use, tag…" autocomplete="off" aria-label="Search design systems">
    <kbd>/</kbd>
  </label>
  <button id="theme" class="icon-btn" type="button" aria-label="Toggle colour theme" title="Toggle theme">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
  </button>
</header>
<main id="app" aria-live="polite"><p class="loading">Loading catalog…</p></main>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot viewer" hidden>
  <button class="lb-close icon-btn" type="button" aria-label="Close">✕</button>
  <button class="lb-prev icon-btn" type="button" aria-label="Previous">‹</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="lb-next icon-btn" type="button" aria-label="Next">›</button>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
