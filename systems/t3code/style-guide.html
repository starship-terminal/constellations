<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T3 Code style guide</title>
<style>
  :root { color-scheme: dark; --page:#000; --surface:#252525; --text:#f5f5f5; --muted:#a1a1a1; --accent:#818cf8; --border:#ffffff14; --danger:#e85d5d; }
  html[data-theme="light"] { color-scheme: light; --page:#fcfcfc; --surface:#fff; --text:#1c1c1e; --muted:#71717a; --accent:#4338ca; --border:#e4e4e7; --danger:#e11d48; }
  body { margin:0; background:var(--page); color:var(--text); font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:880px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-weight:400; letter-spacing:-0.025em; font-size:30px; }
  h2 { font-size:14px; font-weight:500; margin-top:32px; }
  button.theme { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; height:28px; padding:0 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:96px; }
  .chip { height:48px; border-radius:8px; border:1px solid var(--border); }
  .label { color:var(--muted); font-size:12px; margin-top:4px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .composer { background:#1a1a1a; border:1px solid var(--border); border-radius:16px; padding:12px; }
  html[data-theme="light"] .composer { background:#fff; }
  .pill { display:inline-flex; align-items:center; height:28px; padding:0 10px; border-radius:8px; background:var(--accent); color:#fff; }
  .ghost { height:28px; width:28px; border-radius:8px; border:0; background:transparent; color:var(--muted); }
</style>
</head>
<body>
<main>
  <button class="theme" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'">Toggle theme</button>
  <h1>T3 Code</h1>
  <p>Measured from the hosted app, version 0.1.8, on 22 Nov 2026. Values come from tokens.json.</p>
  <h2>Colour</h2>
  <div class="row" id="swatches"></div>
  <h2>Type</h2>
  <p style="font-size:30px;letter-spacing:-0.025em;font-weight:400">What should we build?</p>
  <p style="font-size:14px;font-weight:500">Thread title</p>
  <p style="font-size:12px;color:var(--muted)">Sidebar meta, 12 / 16</p>
  <h2>Composer</h2>
  <div class="composer">
    <div style="color:var(--muted)">Ask anything. @ files, $ skills, / commands</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <span class="pill">Opus 5.5</span>
    </div>
  </div>
  <h2>Controls</h2>
  <div class="row">
    <button class="ghost">+</button>
    <span class="pill">Full access</span>
  </div>
</main>
<script>
const roles = ["page","surface","text","muted","accent","border","danger"];
const colors = {
  dark: ["#000","#252525","#f5f5f5","#a1a1a1","#818cf8","#ffffff14","#e85d5d"],
  light: ["#fcfcfc","#fff","#1c1c1e","#71717a","#4338ca","#e4e4e7","#e11d48"]
};
function paint() {
  const theme = document.documentElement.dataset.theme || "dark";
  document.getElementById("swatches").innerHTML = roles.map((role, i) =>
    `<div class="swatch"><div class="chip" style="background:${colors[theme][i]}"></div><div class="label">${role}</div></div>`
  ).join("");
}
document.documentElement.dataset.theme = "dark";
paint();
document.querySelector(".theme").addEventListener("click", () => setTimeout(paint, 0));
</script>
</body>
</html>
