<!DOCTYPE html>

  <style>
    body { font-family: "Whitney SSm", helvetica, arial, sans-serif; margin: 32px; color: #000d25; background: #ffffff; }
    h1 { font-weight: 700; font-size: 48px; line-height: 60px; letter-spacing: -1.44px; color: #fff; background: #000d25; padding: 24px; }
    .row { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
    .swatch { width: 160px; height: 72px; border-radius: 8px; border: 1px solid #0003; padding: 8px; font-size: 12px; }
    .pill { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 50px; font-size: 16px; font-weight: 500; }
    .accent { background: #1866ee; color: #fff; }
    .quiet { color: #1866ee; border: 1px solid #1866ee; }
    .next { background: #3366ff; color: #fff; height: 36px; border-radius: 4px; padding: 0 22px; font-size: 14px; font-weight: 600; }

<body>
  <h1>Segment and Twilio. We're finally moving in together on Twilio.com!</h1>

    <div class="swatch" style="background:#000d25;color:#fff">ink #000d25</div>
    <div class="swatch" style="background:#ffffff">page #ffffff</div>
    <div class="swatch" style="background:#1866ee;color:#fff">accent #1866ee</div>
    <div class="swatch" style="background:#3366ff;color:#fff">login action #3366ff</div>
    <div class="swatch" style="background:#474d66;color:#fff">login text #474d66</div>
