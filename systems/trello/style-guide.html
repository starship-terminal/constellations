<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trello tokens</title>
  <style>
    :root {
      --page: #ffffff;
      --text: #091e42;
      --nav: #172b4d;
      --link: #0052cc;
      --button: #0065ff;
      --button-text: #ffffff;
      --border: #dfe1e6;
      --trello-blue: #0079bf;
    }
    body { margin: 0; background: var(--page); color: var(--text); font: 20px/30px ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 48px; font-weight: 500; line-height: 60px; margin: 0 0 8px; }
    p { color: var(--nav); }
    a { color: var(--link); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .swatch { border: 1px solid var(--border); border-radius: 4.8px; overflow: hidden; }
    .chip { height: 64px; }
    .label { padding: 8px 10px; font-size: 13px; }
    button { background: var(--button); color: var(--button-text); border: 0; border-radius: 4.8px; padding: 12px 16px; font: 16px/1 ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Trello</h1>
    <p>Measured colours from the public homepage, 22 November 2026. Charlie Text and Charlie Display are not committed. This page uses the system fallback.</p>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="label">page #ffffff</div></div>
      <div class="swatch"><div class="chip" style="background:#091e42"></div><div class="label">text #091e42</div></div>
      <div class="swatch"><div class="chip" style="background:#172b4d"></div><div class="label">nav #172b4d</div></div>
      <div class="swatch"><div class="chip" style="background:#0052cc"></div><div class="label">link #0052cc</div></div>
      <div class="swatch"><div class="chip" style="background:#0065ff"></div><div class="label">button #0065ff</div></div>
      <div class="swatch"><div class="chip" style="background:#dfe1e6"></div><div class="label">border #dfe1e6</div></div>
      <div class="swatch"><div class="chip" style="background:#0079bf"></div><div class="label">trello blue #0079bf</div></div>
    </div>
    <p><button type="button">Sign up - it's free!</button></p>
    <p><a href="https://trello.com/pricing">Pricing</a></p>
  </main>
</body>
</html>
