<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PagerDuty public tokens</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; color: #1d1d1d; background: #fafafa; }
    h1 { font-weight: 300; font-size: 2rem; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .swatch { width: 148px; }
    .chip { height: 72px; border-radius: 8px; border: 1px solid #e5e5e5; }
    p { margin: 8px 0; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>PagerDuty</h1>
  <p>Light tokens read from the public homepage, 22 November 2026. Read values from tokens.json.</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#fafafa"></div><p>page #fafafa</p></div>
    <div class="swatch"><div class="chip" style="background:#1d1d1d"></div><p>text #1d1d1d</p></div>
    <div class="swatch"><div class="chip" style="background:#171717"></div><p>strong #171717</p></div>
    <div class="swatch"><div class="chip" style="background:#048a24"></div><p>accent #048a24</p></div>
    <div class="swatch"><div class="chip" style="background:#005a24"></div><p>pressed #005a24</p></div>
    <div class="swatch"><div class="chip" style="background:#e6f3ea"></div><p>wash #e6f3ea</p></div>
    <div class="swatch"><div class="chip" style="background:#e5e5e5"></div><p>border #e5e5e5</p></div>
  </div>
</body>
</html>
