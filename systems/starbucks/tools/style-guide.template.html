<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starbucks style guide</title>
<meta name="description" content="Starbucks public site tokens, rendered from tokens.json. One light theme. SoDo Sans is proprietary and is not loaded.">
<style>
/* Generated by tools/build_style_guide.py from tokens.json. */
:root {
/*CORE*/
/*LIGHT*/
  color-scheme: light;
  --sg-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
[data-mode="dark"] {
/*DARK*/
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background-page); color: var(--text-primary); font: 400 16px/24px var(--sg-sans); }
.wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font-size: 28px; letter-spacing: -0.24px; }
h2 { margin-top: 40px; font-size: 18px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch { width: 140px; }
.swatch i { display: block; height: 64px; border-radius: 8px; border: 1px solid rgba(0,0,0,.12); }
.swatch span { display: block; font-size: 12px; margin-top: 6px; }
.pill { display: inline-flex; align-items: center; height: 33px; padding: 7px 16px; border-radius: 50px; font-size: 14px; font-weight: 600; text-decoration: none; }
.pill.primary { background: var(--action-primary); color: var(--text-onBrand); }
.pill.line { background: transparent; color: var(--text-ink); border: 1px solid var(--border-default); }
.pill.brand { background: var(--action-brand); color: var(--text-onBrand); border-radius: 500px; height: 44px; padding: 10px 24px; }
.field { display: block; width: 320px; height: 56px; border-radius: 8px; border: 1px solid var(--border-field); padding: 0 16px; font: inherit; }
.banner { background: var(--background-brand); color: var(--text-onBrand); padding: 28px; border-radius: 0; }
.cream { background: var(--background-surface); color: var(--text-heading); padding: 28px; }
nav.sample { display: flex; gap: 20px; font-size: 14px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
nav.sample a { color: var(--text-primary); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Starbucks</h1>
  <p>Public site, one light theme. Values come from computed styles, not from memory. SoDo Sans is not loaded; this page uses Helvetica.</p>
  <h2>Colour</h2>
  <div class="row" id="swatches"></div>
  <h2>Header</h2>
  <nav class="sample"><a>Menu</a><a>Rewards</a><a>Gift cards</a></nav>
  <p>
    <a class="pill line">Sign in</a>
    <a class="pill primary">Join now</a>
  </p>
  <h2>Banner</h2>
  <div class="banner">It's a great day for coffee</div>
  <div class="cream"><strong>Holiday flavors are in town!</strong></div>
  <h2>Field and order</h2>
  <input class="field" placeholder="Email address" readonly>
  <p><a class="pill brand">Add to Order</a></p>
</div>
<script>
const TOKENS = /*TOKENS*/null;
const light = TOKENS.light || {};
const box = document.getElementById('swatches');
function walk(node, path) {
  if (node && node.v && node.t === 'color') {
    const d = document.createElement('div');
    d.className = 'swatch';
    d.innerHTML = '<i></i><span></span>';
    d.querySelector('i').style.background = getComputedStyle(document.documentElement).getPropertyValue('--' + path.replaceAll('.', '-'));
    d.querySelector('span').textContent = path;
    box.appendChild(d);
  } else if (node && typeof node === 'object' && !node.v) {
    for (const k of Object.keys(node)) walk(node[k], path ? path + '.' + k : k);
  }
}
walk(light, '');
</script>
</body>
</html>
