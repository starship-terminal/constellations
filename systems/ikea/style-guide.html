* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 400 14px/22px var(--sg-sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font-size: 32px; line-height: 40px; margin: 0 0 8px; }
h2 { font-size: 18px; margin: 40px 0 12px; }
p.lead { color: var(--muted); max-width: 68ch; }
.pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; }
.sw i { width: 44px; height: 44px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--border); display: block; }
.sw b { font-size: 12px; }
.sw span { display: block; color: var(--muted); font-size: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: var(--component-button-primary-height); padding: 0 28px; border: 0; border-radius: var(--component-button-primary-radius); background: var(--component-button-primary-bg); color: var(--component-button-primary-text); font: 700 16px/24px var(--sg-sans); }
.field { height: var(--component-search-height); padding: 0 16px; border: 1px solid var(--border); border-radius: var(--radius-s); font: 400 16px/24px var(--sg-sans); color: var(--text); background: var(--page); width: 280px; }
.row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.card { background: var(--surface); border-radius: var(--radius-m); padding: 16px; width: 220px; }
.price { font: 700 28px/32px var(--sg-sans); }
</style>
</head>
<body>
<div class="wrap">
  <h1>IKEA Singapore</h1>
  <p class="lead">Tokens from www.ikea.com/sg/en, signed out, 2026-11-19. One light theme. Noto IKEA is not loaded; the samples use Noto Sans.</p>
  <h2>Roles</h2>
  <div class="pal" id="roles"></div>
  <h2>Controls</h2>
  <div class="row">
    <button class="btn">Add to cart</button>
    <input class="field" placeholder="What are you looking for?" />
  </div>
  <h2>Card</h2>
  <div class="card">
    <div class="price">$89</div>
    <div>BILLY bookcase</div>
  </div>
  <h2>Colour layer</h2>
  <div class="pal" id="colours"></div>
</div>
