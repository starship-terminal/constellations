<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mixpanel public tokens</title>
  <style>
    body { font-family: "Garnett Regular", ui-sans-serif, system-ui, sans-serif; margin: 32px; color: #1f2023; background: #fafafa; }
    h1 { font-family: "Garnett Medium", sans-serif; font-weight: 400; font-size: 48px; line-height: 57.6px; letter-spacing: -0.96px; }
    .row { display: flex; gap: 12px; margin: 12px 0; flex-wrap: wrap; }
    .swatch { width: 140px; height: 72px; border-radius: 8px; border: 1px solid #0003; padding: 8px; font-size: 12px; }
    .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 14px; border-radius: 100px; font-size: 12px; font-weight: 500; }
    .ink { background: #1f2023; color: #fff; }
    .quiet { background: rgba(0, 0, 0, 0.07); color: #1f2023; }
    .accent { background: #7856ff; color: #fff; height: 46px; border-radius: 96px; padding: 0 22px; }
  </style>
</head>
<body>
  <h1>Build like your customers are right beside you</h1>
  <p>Values read on 2026-11-22 from the public site and the empty login wall.</p>
  <div class="row">
    <div class="swatch" style="background:#fafafa">page #fafafa</div>
    <div class="swatch" style="background:#1f2023;color:#fff">text #1f2023</div>
    <div class="swatch" style="background:#797979;color:#fff">muted #797979</div>
    <div class="swatch" style="background:#7856ff;color:#fff">accent #7856ff</div>
    <div class="swatch" style="background:#1b0b3b;color:#fff">login heading #1b0b3b</div>
  </div>
  <p><span class="pill ink">Get Started Free</span> <span class="pill quiet">Contact Sales</span> <span class="pill accent">Continue</span></p>
</body>
</html>
