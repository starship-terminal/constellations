<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn style guide</title>
<style>
:root {
  --page: #ffffff;
  --surface: #f3f2f0;
  --text: rgba(0, 0, 0, 0.9);
  --muted: rgba(0, 0, 0, 0.75);
  --accent: #0a66c2;
  --border: rgba(0, 0, 0, 0.75);
  --link: #0a66c2;
  --onAccent: #ffffff;
  --accentHover: #004182;
  --accentPressed: #004182;
  --helpHeader: #0073b1;
  color-scheme: light;
  --sg-sans: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 400 16px/24px var(--sg-sans); }
.wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-weight: 400; font-size: 48px; line-height: 60px; margin: 0 0 8px; }
h2 { font-size: 24px; font-weight: 400; margin: 40px 0 12px; }
p { color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.swatch { width: 96px; }
.swatch i { display: block; height: 48px; border-radius: 8px; border: 1px solid var(--border); }
.swatch span { display: block; font-size: 12px; margin-top: 4px; }
.btn { display: inline-flex; align-items: center; height: 48px; padding: 0 24px; border-radius: 24px; background: var(--accent); color: var(--onAccent); font-weight: 600; text-decoration: none; }
.btn-quiet { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.field { height: 48px; width: 280px; border-radius: 4px; border: 1px solid var(--border); padding: 0 12px; font: inherit; background: transparent; color: var(--text); }
.band { background: var(--surface); padding: 16px; border-radius: 8px; }
a { color: var(--link); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LinkedIn</h1>
  <p>Public guest capture, 2026-11-21. Values come from tokens.json.</p>
  <h2>Colour</h2>
  <div class="row">
    <div class="swatch"><i style="background:var(--page)"></i><span>page</span></div>
    <div class="swatch"><i style="background:var(--surface)"></i><span>surface</span></div>
    <div class="swatch"><i style="background:var(--text)"></i><span>text</span></div>
    <div class="swatch"><i style="background:var(--muted)"></i><span>muted</span></div>
    <div class="swatch"><i style="background:var(--accent)"></i><span>accent</span></div>
    <div class="swatch"><i style="background:var(--border)"></i><span>border</span></div>
  </div>
  <h2>Controls</h2>
  <div class="row">
    <a class="btn" href="#">Join now</a>
    <a class="btn btn-quiet" href="#">Sign in</a>
    <input class="field" placeholder="Email or phone" readonly>
  </div>
  <h2>Surface</h2>
  <div class="band">
    <p style="margin:0">Explore top LinkedIn content. <a href="#">Career</a></p>
  </div>
</div>
</body>
</html>
