<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opsgenie public tokens</title>
<style>
  body { margin: 24px; font: 16px/1.4 ui-sans-serif, system-ui, sans-serif; color: #292A2E; background: #fff; }
  h1 { font-size: 24px; font-weight: 650; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { width: 140px; }
  .chip { height: 56px; border-radius: 8px; border: 1px solid #0B120E24; }
  .label { font-size: 12px; margin-top: 4px; }
  .pill { display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 10000px; background: #1868DB; color: #fff; font-weight: 500; }
</style>
</head>
<body>
<h1>Opsgenie, public light</h1>
<p>Declared AtlasKit colours from the migration page, 2026-11-22. catalog.json was left alone.</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="label">page #FFFFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#292A2E"></div><div class="label">text #292A2E</div></div>
  <div class="swatch"><div class="chip" style="background:#505258"></div><div class="label">subtle #505258</div></div>
  <div class="swatch"><div class="chip" style="background:#1868DB"></div><div class="label">accent #1868DB</div></div>
  <div class="swatch"><div class="chip" style="background:#1558BC"></div><div class="label">hover #1558BC</div></div>
  <div class="swatch"><div class="chip" style="background:#144794"></div><div class="label">pressed #144794</div></div>
  <div class="swatch"><div class="chip" style="background:#C9372C"></div><div class="label">danger #C9372C</div></div>
  <div class="swatch"><div class="chip" style="background:#FBC828"></div><div class="label">warning #FBC828</div></div>
  <div class="swatch"><div class="chip" style="background:#5B7F24"></div><div class="label">success #5B7F24</div></div>
</div>
<p><span class="pill">Plan your migration</span></p>
</body>
</html>
