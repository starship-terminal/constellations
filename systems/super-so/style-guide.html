<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super.so style guide</title>
<style>
  :root, [data-mode="light"] {
    --page: #fdfdfc;
    --surface: #ffffff;
    --text: #262a2e;
    --muted: #66707a;
    --accent: #ffbe3c;
    --on-accent: #111111;
    --border: #e9e9e7;
    --footer: #090909;
    --field: #151514;
    --field-text: #eeeeed;
  }
  [data-mode="dark"] {
    --page: #151514;
    --surface: #151514;
    --text: #eeeeed;
    --muted: #7e7d77;
    --accent: #ffb224;
    --on-accent: #1b1b18;
    --border: #2d2d2a;
    --footer: #090909;
    --field: #151514;
    --field-text: #eeeeed;
  }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: Beausite, Inter, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 24px;
  }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 38.4px; font-weight: 600; letter-spacing: -1px; line-height: 42.24px; margin: 0 0 8px; }
  h2 { font-size: 25.6px; font-weight: 600; letter-spacing: -0.8px; margin: 40px 0 12px; }
  p { color: var(--muted); }
  button.theme {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font: inherit;
  }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .swatch { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .swatch i { display: block; height: 64px; }
  .swatch span { display: block; padding: 8px 10px; font-size: 12px; line-height: 16px; }
  .cta {
    display: inline-flex;
    align-items: center;
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 500;
    text-decoration: none;
    height: 42px;
    box-sizing: border-box;
  }
  .field {
    display: flex;
    align-items: center;
    width: 320px;
    height: 44px;
    padding: 0 16px;
    box-sizing: border-box;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--field);
    color: var(--field-text);
    font-size: 14px;
  }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  footer.note { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <button class="theme" type="button" id="theme">Dark</button>
  <h1>Super.so</h1>
  <p>Measured colours from super.so and app.super.so on 2026-11-19. Viewport was 1169 by 731.</p>

  <h2>Colour</h2>
  <div class="swatches" id="swatches"></div>

  <h2>Button</h2>
  <div class="row">
    <a class="cta" href="#button">Get started free</a>
  </div>

  <h2>Field</h2>
  <div class="field">Email address</div>

  <footer class="note">Beausite is not embedded. The page falls back to Inter, then Helvetica.</footer>
</main>
<script>
const light = [
  ["Page", "#fdfdfc"],
  ["Surface", "#ffffff"],
  ["Text", "#262a2e"],
  ["Muted", "#66707a"],
  ["Accent", "#ffbe3c"],
  ["Border", "#e9e9e7"],
  ["Footer", "#090909"],
  ["On accent", "#111111"]
];
const dark = [
  ["Page", "#151514"],
  ["Surface", "#151514"],
  ["Text", "#eeeeed"],
  ["Muted", "#7e7d77"],
  ["Accent", "#ffb224"],
  ["Border", "#2d2d2a"],
  ["On accent", "#1b1b18"],
  ["Placeholder", "#727169"]
];
const root = document.documentElement;
const box = document.getElementById("swatches");
const button = document.getElementById("theme");
function paint() {
  const mode = root.getAttribute("data-mode");
  const rows = mode === "dark" ? dark : light;
  box.replaceChildren();
  for (const [name, hex] of rows) {
    const el = document.createElement("div");
    el.className = "swatch";
    const chip = document.createElement("i");
    chip.style.background = hex;
    const label = document.createElement("span");
    label.textContent = name + " " + hex;
    el.append(chip, label);
    box.append(el);
  }
  button.textContent = mode === "dark" ? "Light" : "Dark";
}
button.addEventListener("click", () => {
  root.setAttribute("data-mode", root.getAttribute("data-mode") === "dark" ? "light" : "dark");
  paint();
});
paint();
</script>
</body>
</html>
