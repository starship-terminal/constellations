<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>untitled tokens</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #191919; color: #fff; font: 15px/20px "Untitled Sans", "Avenir Next", system-ui, sans-serif; letter-spacing: -0.45px; }
  main { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 26px; line-height: 32px; font-weight: 500; letter-spacing: -0.78px; }
  p { color: #7e7e7e; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
  .swatch { width: 96px; }
  .swatch i { display: block; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); }
  .swatch span { display: block; margin-top: 6px; font-size: 12px; color: #a6a6a6; }
  .pill { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 999px; background: #fff; color: #191919; font-size: 13px; font-weight: 500; letter-spacing: -0.39px; }
  .quiet { display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,.05); color: #fff; font-weight: 500; }
  .card { width: 280px; padding: 24px; border-radius: 20px; background: #202020; }
  .card strong { display: block; font-size: 22px; font-weight: 500; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <h1>[untitled]</h1>
  <p>Hand-built from the 2026-11-22 public capture. Values match tokens.json.</p>
  <div class="row">
    <div class="swatch"><i style="background:#191919"></i><span>page #191919</span></div>
    <div class="swatch"><i style="background:#202020"></i><span>surface #202020</span></div>
    <div class="swatch"><i style="background:#ffffff"></i><span>action #ffffff</span></div>
    <div class="swatch"><i style="background:#7e7e7e"></i><span>muted #7e7e7e</span></div>
    <div class="swatch"><i style="background:#5a8ff7"></i><span>blue #5a8ff7</span></div>
    <div class="swatch"><i style="background:#e699ab"></i><span>pink #e699ab</span></div>
  </div>
  <div class="row">
    <span class="pill">Enter App</span>
    <span class="quiet">[membership]</span>
    <span class="quiet">iOS</span>
  </div>
  <div class="card">
    <strong>[starter]</strong>
    <p>Suite of tools to get you started with [untitled]...</p>
    <p style="color:#fff">Free</p>
  </div>
</main>
</body>
</html>
