<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>&amp; Other Stories public tokens</title>
<style>
  :root {
    --page: #ffffff;
    --text: #000000;
    --promo: #f3f3f3;
    --on-photo: #ffffff;
    --card: #f2f2f2;
    --alert: #cf0b00;
    --heading: #949494;
    --muted: #757575;
    --disabled: #949494;
    --on-disabled: #d9d9d9;
    --body: Quadrant, Helvetica, Arial, sans-serif;
    --mono: "Courier New", Courier, monospace;
    --sans: Helvetica, Arial, sans-serif;
  }
  body { margin: 0; background: var(--page); color: var(--text); font-family: var(--body); font-size: 12px; }
  .promo {
    background: var(--promo);
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }
  header.bar {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid #eee;
  }
  .word { font-family: var(--mono); letter-spacing: 1px; font-size: 14px; text-align: center; }
  nav { display: flex; gap: 18px; font-size: 12px; }
  .hero {
    background: #1a1a1a;
    color: var(--on-photo);
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .hero h1 { margin: 0; font-family: var(--mono); font-size: 34px; font-weight: 400; letter-spacing: 2px; }
  .shop {
    height: 40px;
    padding: 0 18px;
    border-radius: 2px;
    border: 1px solid #fff;
    background: #fff;
    color: #000;
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.96px;
    text-transform: uppercase;
  }
  main { padding: 32px; display: grid; gap: 24px; }
  .swatches { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { width: 72px; height: 48px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .size { width: 48px; height: 40px; border: 1px solid #000; background: #fff; font-size: 10px; }
  .choose {
    width: 280px;
    height: 40px;
    border: 0;
    border-radius: 2px;
    background: var(--disabled);
    color: var(--on-disabled);
    font-family: var(--sans);
    font-size: 12px;
    letter-spacing: 0.96px;
  }
  .last { color: var(--alert); }
  footer {
    background: #000;
    color: #fff;
    padding: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }
  footer h2 { margin: 0 0 8px; color: var(--heading); font-family: var(--mono); font-size: 12px; font-weight: 400; letter-spacing: 1px; }
  footer a { color: #fff; text-decoration: none; display: block; margin: 6px 0; }
</style>
</head>
<body>
  <div class="promo">Sign up for our newsletter and get 10% off one order.</div>
  <header class="bar">
    <span>Shop</span>
    <div class="word">&amp; OTHER<br>STORIES</div>
    <span>Bag</span>
  </header>
  <section class="hero">
    <h1>NEW IN</h1>
    <button class="shop" type="button">Shop now</button>
  </section>
  <main>
    <div class="swatches">
      <div class="chip" style="background:var(--page); border:1px solid #ddd">page</div>
      <div class="chip" style="background:var(--promo)">promo</div>
      <div class="chip" style="background:var(--card)">card</div>
      <div class="chip" style="background:var(--alert); color:#fff">last</div>
      <div class="chip" style="background:var(--disabled); color:var(--on-disabled)">disabled</div>
      <div class="chip" style="background:var(--heading); color:#fff">heading</div>
    </div>
    <p class="last">Last chance</p>
    <div class="row">
      <button class="size" type="button">32</button>
      <button class="size" type="button">34</button>
      <button class="size" type="button">36</button>
      <button class="choose" type="button" disabled>CHOOSE SIZE</button>
    </div>
    <p>Quadrant 12px body stand-in. Product title is 14px. Hero is 34px mono.</p>
  </main>
  <footer>
    <div>
      <h2>COMPANY INFORMATION</h2>
      <a href="#about">About us</a>
    </div>
    <div>
      <h2>CUSTOMER SERVICE</h2>
      <a href="#delivery">Delivery</a>
    </div>
    <div>
      <h2>LEGAL</h2>
      <a href="#privacy">Privacy notice</a>
    </div>
  </footer>
</body>
</html>
