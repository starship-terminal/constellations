<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram style guide</title>
<style>
:root {
/*CORE*/
/*LIGHT*/
  color-scheme: light;
  --sg-sans: "Instagram Sans UI", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --sg-mono: ui-monospace, Menlo, Consolas, monospace;
}
[data-mode="dark"] {
/*DARK*/
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-primary-background); color: var(--color-primary-text); font: 400 15px/20px var(--sg-sans); }
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 64px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
h2 { font-size: 16px; margin: 32px 0 12px; }
button.sw { margin-left: auto; border: 1px solid var(--color-stroke); background: var(--color-secondary-background); color: var(--color-primary-text); border-radius: 8px; padding: 8px 12px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch { width: 140px; }
.swatch i { display: block; height: 48px; border-radius: 8px; border: 1px solid var(--color-stroke); }
.swatch span { display: block; font: 12px/16px var(--sg-mono); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid transparent; font-weight: 500; }
.btn.primary { background: var(--color-button-primary-background); color: var(--color-button-primary-text); }
.btn.secondary { background: var(--color-button-secondary-background); color: var(--color-button-secondary-text); }
.btn.outline { background: transparent; color: var(--color-colors-link-text, var(--color-link)); border-color: var(--color-stroke); }
.field { height: 48px; border-radius: var(--radius-input); border: 1px solid var(--color-stroke); background: var(--color-primary-background); padding: 0 14px; display: flex; align-items: center; color: var(--color-secondary-text); min-width: 280px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Instagram</h1>
  <button class="sw" type="button" id="theme">Theme</button>
</header>
<p>Rendered from tokens.json. Public signed-out capture, 2026-11-21. Instagram Sans UI is not loaded here; the stack falls back to the system face.</p>
<h2>Colour</h2>
<div class="row" id="swatches"></div>
<h2>Controls</h2>
<div class="row">
  <span class="btn primary">Log in</span>
  <span class="btn secondary">Secondary</span>
  <span class="btn outline">Create new account</span>
  <span class="field">Mobile number, username or email</span>
</div>
</div>
<script>
const T = /*TOKENS*/null;
const root = document.documentElement;
document.getElementById('theme').onclick = () => {
  root.dataset.mode = root.dataset.mode === 'dark' ? 'light' : 'dark';
};
const box = document.getElementById('swatches');
const names = ['color-primary-background','color-secondary-background','color-primary-text','color-secondary-text','color-button-primary-background','color-stroke','color-error-or-destructive','color-success'];
for (const n of names) {
  const el = document.createElement('div');
  el.className = 'swatch';
  el.innerHTML = '<i style="background:var(--' + n + ')"></i><span>' + n.replace('color-','') + '</span>';
  box.appendChild(el);
}
</script>
</body>
</html>
