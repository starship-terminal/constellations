<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealthsimple style guide</title>
<style>
/* Generated by tools/build_style_guide.py from tokens.json. Edit the template or the tokens, never this file.
   The Future, Tiempos, and Wealthsimple Sans are licensed faces and are not loaded here. */
:root {
/*CORE*/
/*LIGHT*/
  color-scheme: light;
  --sg-sans: "the-future", system-ui, "Helvetica Neue", sans-serif;
  --sg-serif: tiempos, Georgia, serif;
  --sg-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[data-mode="dark"] {
/*DARK*/
  color-scheme: dark;
  --sg-sans: "Wealthsimple Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--color-page); color: var(--color-text); font: 400 16px/22px var(--sg-sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
h1 { font-size: 28px; font-weight: 500; margin: 0; }
h2 { font-size: 18px; margin: 32px 0 12px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.sw { display: flex; gap: 10px; align-items: center; }
.sw i { width: 36px; height: 36px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--color-border); display: block; }
.sw b { display: block; font-size: 12px; }
.sw span { font-size: 12px; color: var(--color-muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-nav-button-height); padding: 12px 16px; border-radius: var(--radius-pill); background: var(--color-accent); color: var(--color-on-accent); font: 500 14px/19.6px var(--sg-sans); letter-spacing: 0.07px; border: 0; }
.field { height: var(--size-login-field-height); width: 280px; border-radius: var(--radius-normal); border: 1px solid var(--color-border); background: var(--color-surface); padding: 0 16px; color: var(--color-text); }
[data-mode="dark"] .field { background: var(--color-field); }
.toggle { margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Wealthsimple</h1>
  <label class="toggle"><input id="theme" type="checkbox"> Dark</label>
</header>
<p>Public marketing light tokens, and the signed-out login dark tokens. Fonts are named only. The files are not loaded.</p>
<h2>Colour</h2>
<div class="swatches" id="swatches"></div>
<h2>Controls</h2>
<div class="row">
  <span class="btn">Get started</span>
  <input class="field" placeholder="Email" readonly>
</div>
<h2>Type</h2>
<div id="type"></div>
</div>
<script>
const TOK = /*TOKENS*/null;
const themeBox = document.getElementById("theme");
function paint() {
  const mode = themeBox.checked ? "dark" : "light";
  document.documentElement.setAttribute("data-mode", mode);
  const colors = TOK[mode].color || {};
  document.getElementById("swatches").innerHTML = Object.entries(colors).map(([name, token]) => {
    const value = token.v;
    return `<div class="sw"><i style="background:${value}"></i><div><b>${name}</b><span>${value}</span></div></div>`;
  }).join("");
  const type = TOK.core.typography || {};
  document.getElementById("type").innerHTML = Object.entries(type).map(([name, token]) => {
    const v = token.v;
    return `<p style="font-size:${v.fontSize};line-height:${v.lineHeight};font-weight:${v.fontWeight};letter-spacing:${v.letterSpacing};margin:8px 0"><b>${name}</b> ${v.fontSize} / ${v.lineHeight}</p>`;
  }).join("");
}
themeBox.addEventListener("change", paint);
paint();
</script>
</body>
</html>
