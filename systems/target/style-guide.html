<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Target style guide</title>
<style>
  body { margin: 24px; font-family: Helvetica, Arial, sans-serif; color: #333333; background: #ffffff; }
  h1 { font-size: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { width: 140px; }
  .chip i { display: block; height: 56px; border-radius: 8px; border: 1px solid #888888; }
  code { font-size: 12px; color: #666666; }
  button { background: #cc0000; color: #ffffff; border: 0; border-radius: 999px; height: 44px; padding: 0 16px; font-weight: 700; }
  input { height: 44px; border-radius: 999px; border: 0; background: #f7f7f7; padding: 0 16px; width: 280px; }
</style>
</head>
<body>
  <h1>Target</h1>
  <p>Public tokens measured on target.com, 2026-11-22. Helvetica for Target is the UI face. The file is not in this package.</p>
  <div class="row"><div class="chip"><i style="background:#ffffff"></i><span>Page</span><code>#ffffff</code></div>
<div class="chip"><i style="background:#333333"></i><span>Text</span><code>#333333</code></div>
<div class="chip"><i style="background:#666666"></i><span>Muted</span><code>#666666</code></div>
<div class="chip"><i style="background:#cc0000"></i><span>Accent</span><code>#cc0000</code></div>
<div class="chip"><i style="background:#ffffff"></i><span>On accent</span><code>#ffffff</code></div>
<div class="chip"><i style="background:#f7f7f7"></i><span>Surface</span><code>#f7f7f7</code></div>
<div class="chip"><i style="background:#888888"></i><span>Border</span><code>#888888</code></div>
<div class="chip"><i style="background:#151515"></i><span>Focus</span><code>#151515</code></div>
<div class="chip"><i style="background:#008300"></i><span>Success</span><code>#008300</code></div>
<div class="chip"><i style="background:#b85300"></i><span>Warning</span><code>#b85300</code></div>
<div class="chip"><i style="background:#2758b9"></i><span>Info</span><code>#2758b9</code></div></div>
  <p><input placeholder="What can we help you find?" aria-label="Search"> <button>Sign up</button></p>
</body>
</html>
