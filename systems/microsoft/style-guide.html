<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Microsoft public style guide</title>
  <style>
    :root {
      --page: #ffffff;
      --header: #ffffff;
      --action: #0078d4;
      --action-hover: #006dc1;
      --heading: #0e1726;
      --nav: #262626;
      --on-action: #ffffff;
      --field-border: #0067b8;
      --font: "Segoe UI Variable Text", "Segoe UI", segoeui, "Helvetica Neue", helvetica, arial, sans-serif;
      --uhf: "Segoe UI", SegoeUI, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    body { margin: 0; background: var(--page); color: var(--heading); font-family: var(--font); }
    header { height: 54px; display: flex; align-items: center; gap: 24px; padding: 0 72px; font-family: var(--uhf); font-size: 13px; color: var(--nav); border-bottom: 1px solid #e7e7e7; }
    main { padding: 48px 72px; max-width: 960px; }
    h1 { font-size: 48px; line-height: 56px; font-weight: 500; letter-spacing: -1.2px; margin: 0 0 16px; }
    .btn { display: inline-block; background: var(--action); color: var(--on-action); font-size: 15px; line-height: 22px; font-weight: 600; letter-spacing: -0.3px; padding: 12px 17px; border-radius: 8px; text-decoration: none; }
    .btn:hover { background: var(--action-hover); }
    .field { display: block; margin-top: 24px; width: 360px; height: 36px; box-sizing: border-box; border: 1px solid var(--field-border); border-radius: 0; padding: 0 12px; font: 16px var(--font); color: var(--nav); }
    .field:focus { outline: 2px solid var(--field-border); }
    table { border-collapse: collapse; margin-top: 32px; font-size: 14px; }
    td { padding: 8px 16px 8px 0; }
    .swatch { width: 36px; height: 24px; display: inline-block; vertical-align: middle; border: 1px solid #e7e7e7; }
  </style>
</head>
<body>
  <header>
    <strong>Microsoft</strong>
    <span>Microsoft 365</span>
    <span>Windows</span>
    <span>Surface</span>
    <span style="margin-left:auto">All Microsoft</span>
    <span>Sign in</span>
  </header>
  <main>
    <h1>Meet the latest Surface Laptop</h1>
    <a class="btn" href="#shop">Shop now</a>
    <input class="field" placeholder="Search Microsoft.com" aria-label="Search Microsoft.com">
    <table>
      <tr><td><span class="swatch" style="background:#ffffff"></span></td><td>page #ffffff</td></tr>
      <tr><td><span class="swatch" style="background:#0078d4"></span></td><td>action #0078d4</td></tr>
      <tr><td><span class="swatch" style="background:#006dc1"></span></td><td>action hover #006dc1</td></tr>
      <tr><td><span class="swatch" style="background:#0e1726"></span></td><td>heading #0e1726</td></tr>
      <tr><td><span class="swatch" style="background:#262626"></span></td><td>nav #262626</td></tr>
      <tr><td><span class="swatch" style="background:#0067b8"></span></td><td>field border #0067b8</td></tr>
    </table>
  </main>
</body>
</html>
