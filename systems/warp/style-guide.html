  .cta { display: inline-block; background: rgb(26, 21, 34); color: rgb(255, 255, 255); border-radius: 4px; padding: 6px 16px; font: 500 13px/1.4 ui-monospace, monospace; text-decoration: none; }
  .demo { display: inline-block; background: rgb(237, 248, 114); color: rgb(0, 0, 0); border-radius: 999px; padding: 6px 16px; font: 500 12px/1.4 ui-monospace, monospace; text-decoration: none; margin-left: 8px; }

  <h1>The software factory infrastructure platform</h1>

  <div class="row">

    <div class="swatch"><div class="chip" style="background:rgb(26, 21, 34)"></div><div class="label">ink</div></div>

    <div class="swatch"><div class="chip" style="background:rgb(237, 248, 114)"></div><div class="label">demo</div></div>
    <div class="swatch"><div class="chip" style="background:rgb(8, 9, 10)"></div><div class="label">banner</div></div>
