<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bitbucket tokens</title>
  <style>
    :root {
      --page: #ffffff;
      --text: #101214;
      --body: #292a2e;
      --link: #1868db;
      --button: #1868db;
      --button-text: #ffffff;
      --premium: #fca700;
      --status: #36b37e;
    }
    body { margin: 0; background: var(--page); color: var(--body); font: 16px/1.4 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 64px; font-weight: 500; line-height: 66.56px; letter-spacing: -1.28px; margin: 0 0 8px; color: var(--text); }
    p { color: var(--body); }
    a { color: var(--link); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .swatch { border: 1px solid #dcdfe4; border-radius: 12px; overflow: hidden; }
    .chip { height: 64px; }
    .label { padding: 8px 10px; font-size: 13px; }
    button { background: var(--button); color: var(--button-text); border: 0; border-radius: 10000px; padding: 8px 22px; font: 500 16px/1 ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <h1>Bitbucket</h1>
    <p>Measured colours from the public homepage, 22 November 2026. Charlie Text and Charlie Display are not committed. This page uses the system fallback.</p>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="label">page #ffffff</div></div>
      <div class="swatch"><div class="chip" style="background:#101214"></div><div class="label">text #101214</div></div>
      <div class="swatch"><div class="chip" style="background:#292a2e"></div><div class="label">body #292a2e</div></div>
      <div class="swatch"><div class="chip" style="background:#1868db"></div><div class="label">link and button #1868db</div></div>
      <div class="swatch"><div class="chip" style="background:#fca700"></div><div class="label">premium #fca700</div></div>
      <div class="swatch"><div class="chip" style="background:#36b37e"></div><div class="label">status #36b37e</div></div>
    </div>
    <p><button type="button">Get it Free</button></p>
    <p><a href="https://bitbucket.org/">Watch demo</a></p>
  </main>
</body>
</html>
