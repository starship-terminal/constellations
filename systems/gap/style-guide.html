<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Gap public tokens</title>
  <style>
    body { margin: 32px; font-family: Arial, Helvetica, sans-serif; color: #000; background: #fff; }
    h1 { font-size: 32px; font-weight: 400; letter-spacing: 0.08em; }
    .row { display: flex; gap: 16px; margin: 16px 0; }
    .swatch { width: 120px; height: 72px; border: 1px solid #000; }
    .bar { background: #000; color: #fff; height: 46px; line-height: 46px; padding: 0 16px; letter-spacing: 0.2px; font-size: 12px; }
    .search { display: inline-block; background: rgba(231, 231, 231, 0.3); height: 32px; line-height: 32px; padding: 0 12px; width: 270px; }
    .bag { display: inline-block; background: #031ba1; color: #fff; height: 44px; line-height: 44px; padding: 0 24px; }
    .login { display: inline-block; background: #020202; color: #fff; height: 44px; line-height: 44px; padding: 0 24px; border-radius: 4px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>GAP</h1>
  <p>Measured 2026-11-22, signed out. Gap Sans and Lato are named in the tokens. This page falls back to Arial.</p>
  <div class="bar">Gap &nbsp; Gap Factory &nbsp; Old Navy &nbsp; Banana Republic &nbsp; Athleta</div>
  <div class="row">
    <div><div class="swatch" style="background:#ffffff"></div><div>page #ffffff</div></div>
    <div><div class="swatch" style="background:#000000"></div><div>ink #000000</div></div>
    <div><div class="swatch" style="background:#031ba1"></div><div>accent #031ba1</div></div>
    <div><div class="swatch" style="background:#757575"></div><div>muted #757575</div></div>
  </div>
  <p class="search">Search Gap</p>
  <p><span class="bag">Add to Bag</span></p>
  <p><span class="login">Continue</span></p>
  <p><a href="site-tree.md">Site tree</a></p>
</body>
</html>
