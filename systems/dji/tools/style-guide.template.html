<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJI style guide</title>
<style>
:root {
/*CORE*/
/*LIGHT*/
  color-scheme: light;
  --sg-sans: "Open Sans", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background-page); color: var(--text-primary); font: 400 16px/24px var(--sg-sans); }
.wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 64px; }
h1 { font-size: 32px; font-weight: 600; margin: 0 0 8px; }
h2 { font-size: 20px; margin: 32px 0 12px; }
p { color: var(--text-muted); max-width: 68ch; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.sw { width: 72px; height: 48px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.store { display: inline-flex; align-items: center; height: var(--size-store); padding: 8px 16px; border-radius: 999px; background: var(--action-primary); color: var(--text-onAccent); font-size: 14px; text-decoration: none; }
.buy { display: inline-flex; align-items: center; height: var(--size-buy); padding: 0 16px; border-radius: var(--radius-buy); background: var(--accent-default); color: var(--text-onAccent); text-decoration: none; }
.ghost { display: inline-flex; align-items: center; height: 32px; padding: 5px 16px; border-radius: var(--radius-hero); border: 1px solid #fff; color: #fff; background: #1a1d24; text-decoration: none; }
.field { height: var(--size-field); border: 1px solid var(--border-default); border-radius: var(--radius-field); padding: 7px 11px; font: inherit; }
.disabled { height: var(--size-submit); padding: 0 15px; border-radius: var(--radius-field); border: 1px solid var(--border-default); background: var(--action-disabled); color: var(--text-disabled); }
nav.sample { display: flex; gap: 20px; height: var(--size-nav); align-items: center; background: var(--background-header); }
nav.sample a { color: var(--text-primary); text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DJI</h1>
  <p>Public site, one light theme. Values come from tokens.json. The homepage hero is a photograph, so the outline pills below sit on a dark sample, not a tokenised dark theme.</p>
  <h2>Colour</h2>
  <div class="row">
    <div class="sw" style="background: var(--background-page)"></div>
    <div class="sw" style="background: var(--background-surface)"></div>
    <div class="sw" style="background: var(--accent-default)"></div>
    <div class="sw" style="background: var(--accent-hover)"></div>
    <div class="sw" style="background: var(--text-primary)"></div>
    <div class="sw" style="background: var(--text-muted)"></div>
  </div>
  <h2>Bar</h2>
  <nav class="sample"><strong>dji</strong><a>Camera Drones</a><a>Handheld</a><a>Support</a></nav>
  <h2>Actions</h2>
  <div class="row">
    <a class="store">Store</a>
    <a class="buy">Buy Now</a>
    <a class="ghost">Learn More</a>
    <button class="disabled" disabled>Log In</button>
  </div>
  <h2>Field</h2>
  <input class="field" placeholder="Password" readonly>
</div>
</body>
</html>
