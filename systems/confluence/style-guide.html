<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confluence public tokens</title>
<style>
  body { margin: 32px; font: 16px/1.4 system-ui, sans-serif; color: #292a2e; background: #fff; }
  h1 { font-size: 32px; font-weight: 500; letter-spacing: -0.5px; color: #101214; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 32px; }
  .swatch { width: 140px; }
  .chip { height: 72px; border-radius: 8px; border: 1px solid #e6e6e6; }
  .label { font-size: 13px; margin-top: 6px; }
  button.demo { background: #1868db; color: #fff; border: 2px solid transparent; border-radius: 10000px; height: 40px; padding: 8px 22px; font: 500 16px system-ui, sans-serif; }
  .field { background: #f8f8f8; border-radius: 25px; height: 44px; padding: 0 14px; display: inline-flex; align-items: center; color: #292a2e; }
</style>
</head>
<body>
  <h1>Confluence, light</h1>
  <p>Measured 2026-11-22 on the public site. Faces fall back to system-ui.</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="label">Page #ffffff</div></div>
    <div class="swatch"><div class="chip" style="background:#292a2e"></div><div class="label">Text #292a2e</div></div>
    <div class="swatch"><div class="chip" style="background:#101214"></div><div class="label">Heading #101214</div></div>
    <div class="swatch"><div class="chip" style="background:#1868db"></div><div class="label">Primary #1868db</div></div>
    <div class="swatch"><div class="chip" style="background:#e9f2fe"></div><div class="label">Banner #e9f2fe</div></div>
    <div class="swatch"><div class="chip" style="background:#f8f8f8"></div><div class="label">Field #f8f8f8</div></div>
  </div>
  <p><button class="demo">Get it free</button></p>
  <p><span class="field">you@company.com</span></p>
</body>
</html>
