<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Etsy public tokens</title>
  <style>
    body { margin: 32px; font-family: Georgia, serif; color: #312b36; background: #faf8f5; }
    h1 { font-size: 32px; font-weight: 400; }
    p, div { font-family: Arial, sans-serif; }
    .row { display: flex; gap: 16px; margin: 16px 0; }
    .swatch { width: 120px; height: 72px; border-radius: 12px; border: 1px solid #928681; }
    .search { display: inline-flex; height: 48px; }
    .field { border: 2px solid #312b36; border-right: 0; border-radius: 24px 0 0 24px; padding: 0 18px; line-height: 44px; background: transparent; }
    .btn { width: 48px; border-radius: 24px; background: #f1641e; color: #faf8f5; line-height: 48px; text-align: center; font-weight: 700; }
    .ink { display: inline-block; background: #312b36; color: #faf8f5; border-radius: 24px; height: 48px; line-height: 48px; padding: 0 24px; }
  </style>
</head>
<body>
  <h1>Etsy, public homepage</h1>
  <p>Measured 2026-11-22, signed out. ABCDiatype and ABCOtto are named in the tokens. This page falls back to Arial and Georgia.</p>
  <div class="row">
    <div><div class="swatch" style="background:#faf8f5"></div><div>page #faf8f5</div></div>
    <div><div class="swatch" style="background:#312b36"></div><div>text #312b36</div></div>
    <div><div class="swatch" style="background:#f1641e"></div><div>accent #f1641e</div></div>
  </div>
  <p class="search"><span class="field">Search for anything</span><span class="btn">Q</span></p>
  <p><span class="ink">Continue</span></p>
  <p><a href="site-tree.md">Site tree</a></p>
</body>
</html>
