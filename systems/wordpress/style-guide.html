<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WordPress.com public tokens</title>
<style>
  body { margin: 0; background: #ffffff; color: #101517; font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 32px; font-weight: 400; letter-spacing: -0.02em; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0 28px; }
  .swatch { width: 120px; }
  .chip { height: 64px; border-radius: 4px; border: 1px solid #dcdcde; }
  .label { font-size: 12px; color: #646970; margin-top: 6px; }
  .pill { display: inline-block; background: #3858e9; color: #ffffff; border-radius: 4px; padding: 12px 20px; font-weight: 500; }
  p.note { color: #646970; }
</style>
</head>
<body>
<main>
  <h1>WordPress.com</h1>
  <p class="note">Declared Studio colours from the public homepage, 2026-11-22. Screenshots are 256-colour and are not a source of values.</p>
  <p><span class="pill">Get started</span></p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#3858e9"></div><div class="label">blue #3858e9</div></div>
    <div class="swatch"><div class="chip" style="background:#101517"></div><div class="label">ink #101517</div></div>
    <div class="swatch"><div class="chip" style="background:#646970"></div><div class="label">gray #646970</div></div>
    <div class="swatch"><div class="chip" style="background:#f6f7f7"></div><div class="label">paper #f6f7f7</div></div>
    <div class="swatch"><div class="chip" style="background:#008a20"></div><div class="label">green #008a20</div></div>
    <div class="swatch"><div class="chip" style="background:#d63638"></div><div class="label">red #d63638</div></div>
    <div class="swatch"><div class="chip" style="background:#c9356e"></div><div class="label">pink #c9356e</div></div>
  </div>
</main>
</body>
</html>
