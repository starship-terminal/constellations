  --control-pillRadius: 100px;

  --sg-sans: "Cera Pro", "Trebuchet MS", sans-serif;

* { box-sizing: border-box; }
body { margin: 0; font: 400 16px/1.5 var(--sg-sans); color: var(--text-primary, #0e1012); background: var(--background-page, #fff); }
main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font: 700 40px/1.15 var(--sg-sans); margin: 0 0 8px; }
h2 { font: 700 13px/1 var(--sg-sans); letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted, #566171); margin: 40px 0 10px; border-bottom: 1px solid var(--border-default, #d5dae2); padding-bottom: 8px; }
.note { color: var(--text-secondary, #333943); max-width: 68ch; }
.pill { display: inline-flex; align-items: center; height: 38px; padding: 0 16px; border-radius: 100px; background: var(--background-accent, #007afc); color: var(--text-onAccent, #fff); font-weight: 700; font-size: 14px; }
.pill.stroke { background: transparent; color: var(--text-primary, #0e1012); box-shadow: inset 0 0 0 1px var(--border-strong, #a0aaba); }
.nav { display: flex; align-items: center; gap: 16px; height: 64px; }
.nav .sp { flex: 1; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 92px; }
.sw i { display: block; height: 40px; border-radius: 8px; border: 1px solid var(--border-default, #d5dae2); }
.sw b, .sw span { display: block; font: 500 11px/1.3 var(--sg-sans); }
.sw span { font-weight: 400; color: var(--text-muted, #566171); }
</style>
</head>
<body>
<main>
  <h1>Mapbox</h1>
  <p class="note">Public signed-out surfaces of mapbox.com, rendered from tokens.json. The mock uses the measured blue pill and the Cera Pro stack. Screenshots are the evidence for layout.</p>
  <div class="nav"><b>Mapbox</b><span>Products</span><span>Pricing</span><span class="sp"></span><span class="pill stroke">Log in</span><span class="pill">Sign up</span></div>
  <h2>Roles</h2>
  <div id="roles" class="swatches"></div>
  <h2>Ramps</h2>
  <div id="ramps"></div>
</main>
<script>
const TOK = {"core": {"color": {"gray": {"5": {"v": "#f7f9fc", "t": "color"}, "10": {"v": "#eceff5", "t": "color"}, "20": {"v": "#d5dae2", "t": "color"}, "30": {"v": "#bbc2ce", "t": "color"}, "40": {"v": "#a0aaba", "t": "color"}, "50": {"v": "#8b96aa", "t": "color"}, "60": {"v": "#566171", "t": "color"}, "70": {"v": "#333943", "t": "color"}, "80": {"v": "#23262d", "t": "color"}, "90": {"v": "#15171b", "t": "color"}}, "blue": {"5": {"v": "#eff7ff", "t": "color"}, "10": {"v": "#cbe4ff", "t": "color"}, "20": {"v": "#98caff", "t": "color"}, "30": {"v": "#64afff", "t": "color"}, "40": {"v": "#3195ff", "t": "color"}, "50": {"v": "#007afc", "t": "color"}, "60": {"v": "#0062ca", "t": "color"}, "70": {"v": "#004997", "t": "color"}, "80": {"v": "#013165", "t": "color"}, "90": {"v": "#001832", "t": "color"}}, "primary": {"5": {"v": "#eff7ff", "t": "color"}, "10": {"v": "#cbe4ff", "t": "color"}, "20": {"v": "#98caff", "t": "color"}, "30": {"v": "#64afff", "t": "color"}, "40": {"v": "#3195ff", "t": "color"}, "50": {"v": "#007afc", "t": "color"}, "60": {"v": "#0062ca", "t": "color"}, "70": {"v": "#004997", "t": "color"}, "80": {"v": "#013165", "t": "color"}, "90": {"v": "#001832", "t": "color"}, "base": {"v": "#007afc", "t": "color"}}, "green": {"5": {"v": "#e9faf1", "t": "color"}, "10": {"v": "#c9f2dd", "t": "color"}, "20": {"v": "#93e4bb", "t": "color"}, "30": {"v": "#5cd79a", "t": "color"}, "40": {"v": "#2fc078", "t": "color"}, "50": {"v": "#228a56", "t": "color"}, "60": {"v": "#1b6e45", "t": "color"}, "70": {"v": "#145334", "t": "color"}, "80": {"v": "#0e3722", "t": "color"}, "90": {"v": "#071c11", "t": "color"}}, "orange": {"5": {"v": "#fff5ea", "t": "color"}, "10": {"v": "#ffe6cb", "t": "color"}, "20": {"v": "#ffcd98", "t": "color"}, "30": {"v": "#ffb464", "t": "color"}, "40": {"v": "#ff9b31", "t": "color"}, "50": {"v": "#fc8200", "t": "color"}, "60": {"v": "#ca6800", "t": "color"}, "70": {"v": "#974e00", "t": "color"}, "80": {"v": "#653400", "t": "color"}, "90": {"v": "#321a00", "t": "color"}}, "red": {"5": {"v": "#fcefed", "t": "color"}, "10": {"v": "#fcd6d1", "t": "color"}, "20": {"v": "#f9ada3", "t": "color"}, "30": {"v": "#f78475", "t": "color"}, "40": {"v": "#f45b47", "t": "color"}, "50": {"v": "#f13219", "t": "color"}, "60": {"v": "#c9220c", "t": "color"}, "70": {"v": "#961a09", "t": "color"}, "80": {"v": "#641106", "t": "color"}, "90": {"v": "#320903", "t": "color"}}, "yellow": {"5": {"v": "#fffced", "t": "color"}, "10": {"v": "#fff7d3", "t": "color"}, "20": {"v": "#ffefa7", "t": "color"}, "30": {"v": "#fee67a", "t": "color"}, "40": {"v": "#fede4e", "t": "color"}, "50": {"v": "#fed622", "t": "color"}, "60": {"v": "#e5bc01", "t": "color"}, "70": {"v": "#ac8d01", "t": "color"}, "80": {"v": "#735e01", "t": "color"}, "90": {"v": "#392f00", "t": "color"}}, "white": {"0": {"v": "#ffffff", "t": "color"}}}, "font": {"family": {"display": {"v": "Cera Pro, \"Trebuchet MS\", sans-serif", "t": "fontFamily"}, "body": {"v": "Open Sans, sans-serif", "t": "fontFamily"}}, "size": {"xxsmall": {"v": "12px", "t": "dimension"}, "xsmall": {"v": "14px", "t": "dimension"}, "small": {"v": "16px", "t": "dimension"}, "regular": {"v": "18px", "t": "dimension"}, "medium": {"v": "20px", "t": "dimension"}, "large": {"v": "22px", "t": "dimension"}, "xlarge": {"v": "24px", "t": "dimension"}, "xxlarge": {"v": "28px", "t": "dimension"}, "display": {"v": "56px", "t": "dimension"}}, "weight": {"regular": {"v": 400, "t": "number"}, "medium": {"v": 500, "t": "number"}, "bold": {"v": 700, "t": "number"}}, "lineHeight": {"display": {"v": "70px", "t": "dimension"}}}}, "light": {"background": {"page": {"v": "#ffffff", "t": "color"}, "surface": {"v": "#f7f9fc", "t": "color"}, "raised": {"v": "#eceff5", "t": "color"}, "accent": {"v": "#007afc", "t": "color"}, "accentHover": {"v": "#3195ff", "t": "color"}}, "text": {"primary": {"v": "#0e1012", "t": "color"}, "secondary": {"v": "#333943", "t": "color"}, "muted": {"v": "#566171", "t": "color"}, "disabled": {"v": "#a0aaba", "t": "color"}, "onAccent": {"v": "#ffffff", "t": "color"}, "link": {"v": "#007afc", "t": "color"}}, "border": {"default": {"v": "#d5dae2", "t": "color"}, "strong": {"v": "#a0aaba", "t": "color"}, "focus": {"v": "#007afc", "t": "color"}}, "status": {"success": {"v": "#228a56", "t": "color"}, "warning": {"v": "#fed622", "t": "color"}, "danger": {"v": "#f13219", "t": "color"}, "info": {"v": "#007afc", "t": "color"}}, "control": {"navHeight": {"v": "37.9844px", "t": "dimension"}, "ctaHeight": {"v": "51.5938px", "t": "dimension"}, "pillRadius": {"v": "100px", "t": "dimension"}}}};
const css = (p) => '--' + p.replace(/\./g, '-').replace(/[^a-zA-Z0-9-]/g, '-');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const flat = (node, prefix='') => Object.entries(node||{}).flatMap(([k,v]) => v && v.t ? [[prefix+k, v]] : (v && typeof v === 'object' ? flat(v, prefix+k+'.') : []));
const roles = document.getElementById('roles');
for (const [n, t] of flat(TOK.light, '')) {
  if (t.t !== 'color') continue;
  roles.insertAdjacentHTML('beforeend', `<div class="sw"><i style="background:var(${css(n)})"></i><b>${esc(n)}</b><span>${esc(t.v)}</span></div>`);
}
const ramps = document.getElementById('ramps');
for (const [g, grp] of Object.entries((TOK.core && TOK.core.color) || {})) {
  let html = `<h2>${esc(g)}</h2><div class="swatches">`;
  for (const [n, t] of flat(grp, g + '.')) {
    if (t.t !== 'color') continue;
    html += `<div class="sw"><i style="background:${esc(t.v)}"></i><b>${esc(n)}</b><span>${esc(t.v)}</span></div>`;
  }
  ramps.insertAdjacentHTML('beforeend', html + '</div>');
}
</script>
</body>
