<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO style guide</title>
<style>
/* Generated by tools/build_style_guide.py from tokens.json. */
:root {
/*CORE*/
/*LIGHT*/
  color-scheme: light;
  --sg-sans: "Cera Pro", "Noto Sans", ui-sans-serif, system-ui, sans-serif;
  --ink: var(--text, #141414);
  --line: var(--border, #b0b0b0);
  --blue: var(--accent, #005ad2);
  --orange: var(--emphasis, #e96f14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.45 var(--sg-sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font-size: 32px; margin: 0 0 8px; }
h2 { margin: 40px 0 12px; font-size: 22px; }
p.lead { color: var(--muted); max-width: 68ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.sw { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; }
.sw i { width: 40px; height: 40px; border-radius: 8px; box-shadow: inset 0 0 0 1px #0002; display: block; }
.sw b { display: block; font-size: 12px; }
.sw span { font-size: 11px; color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; height: 48px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--orange); color: #141414; font: 500 18px/1 var(--sg-sans); }
.btn.blue { background: var(--blue); color: #fff; }
.field { height: 44px; border: 1px solid var(--line); border-radius: 4px; padding: 0 12px; font: 400 16px var(--sg-sans); min-width: 220px; }
.card { width: 220px; background: #fff; border-radius: 8px; box-shadow: 0 1px 1px #0000000f, 0 2px 2px -1px #00000017; padding: 12px; }
.card .ph { height: 120px; background: #f7f7f7; border-radius: 4px; margin-bottom: 8px; }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>LEGO shop</h1>
  <p class="lead">Public Official LEGO Shop US, captured 2026-11-18, signed out. Values come from tokens.json. Cera Pro is proprietary and falls back here.</p>
  <h2>Roles</h2>
  <div class="grid" id="roles"></div>
  <h2>Brand</h2>
  <div class="grid" id="brand"></div>
  <h2>Components</h2>
  <div class="row">
    <button class="btn" type="button">Add to Bag</button>
    <button class="btn blue" type="button">Primary</button>
    <input class="field" placeholder="Search" aria-label="Search">
  </div>
  <div class="card" style="margin-top:16px">
    <div class="ph"></div>
    <b>Product card</b>
    <div class="note">$129.99</div>
  </div>
  <h2>Spacing</h2>
  <div id="space"></div>
  <p class="note">One light theme. Dark is not published on the shop.</p>
</div>
<script>
const TOKENS = /*TOKENS*/null;
function val(path) {
  const parts = path.split('.');
  let n = TOKENS.light;
  for (const p of parts) n = n && n[p];
  if (!n) return '';
  let v = n.v;
  if (typeof v === 'string' && v.startsWith('{')) {
    const ref = v.slice(1, -1).split('.');
    let c = TOKENS.core;
    for (const p of ref) c = c && c[p];
    return c ? c.v : v;
  }
  return v;
}
// Token names and values come from third-party CSS: build nodes with
// textContent and style properties, never innerHTML.
function swatch(name, v) {
  const el = document.createElement('div');
  el.className = 'sw';
  const chip = document.createElement('i');
  chip.style.background = v;
  const label = document.createElement('div');
  const b = document.createElement('b');
  b.textContent = name;
  const span = document.createElement('span');
  span.textContent = v;
  label.append(b, span);
  el.append(chip, label);
  return el;
}
const roles = document.getElementById('roles');
for (const key of ['page','surface','text','muted','accent','border','emphasis','positive','warning','negative']) {
  roles.appendChild(swatch(key, val(key)));
}
function walk(node, prefix, out) {
  if (!node || typeof node !== 'object') return;
  if ('v' in node) { out.push([prefix, node.v]); return; }
  for (const [k, child] of Object.entries(node)) walk(child, prefix ? prefix + '.' + k : k, out);
}
const brand = [];
walk(TOKENS.core.color && TOKENS.core.color.brand, 'brand', brand);
const box = document.getElementById('brand');
for (const [name, v] of brand.slice(0, 24)) {
  box.appendChild(swatch(name, v));
}
const space = document.getElementById('space');
const steps = [];
walk(TOKENS.core.space, '', steps);
for (const [name, v] of steps) {
  const row = document.createElement('div');
  row.style.cssText = 'display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin:4px 0;font-size:12px';
  const label = document.createElement('span');
  label.textContent = name + ' ' + v;
  const bar = document.createElement('i');
  bar.style.cssText = 'display:block;height:10px;background:var(--accent, #005ad2)';
  bar.style.width = v;
  row.append(label, bar);
  space.appendChild(row);
}
</script>
</body>
</html>
