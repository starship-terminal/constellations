<!doctype html>
<html lang="en" data-mode="marketing">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reown style guide</title>
<style>
  :root {
    --page: #9a9a9a;
    --surface: #202020;
    --text: #ffffff;
    --muted: #6c6c6c;
    --ink: #202020;
    --action: #379def;
    --accent: #0988f0;
    --orange: #f4624a;
    --green: #18ac65;
    --field: #363636;
    --border: #ffffff;
    --sans: "KHTeka-Regular", sans-serif;
    --mono: "KHTekaMono-Regular", monospace;
  }
  [data-mode="docs-dark"] {
    --page: #202020;
    --surface: #202020;
    --text: #dee2e0;
    --muted: #9ea2a0;
    --ink: #ffffff;
    --action: #008847;
    --accent: #008847;
    --border: #252927;
    --sans: Inter, sans-serif;
    --mono: "Paper Mono", ui-monospace, monospace;
  }
  [data-mode="docs-light"] {
    --page: #ffffff;
    --surface: #ffffff;
    --text: #161a18;
    --muted: #4f5452;
    --ink: #252927;
    --action: #008847;
    --accent: #008847;
    --border: #eef2f0;
    --sans: Inter, sans-serif;
    --mono: "Paper Mono", ui-monospace, monospace;
  }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
  header, main { padding: 24px; max-width: 960px; }
  h1 { font-weight: 400; font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; color: var(--text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  button.swatch, .chip { border: 0; border-radius: 16px; padding: 13px 15px; font-family: var(--mono); letter-spacing: -0.05rem; cursor: pointer; }
  .hero {
    background: #202020; color: #fff; border-radius: 40px; padding: 40px;
  }
  [data-mode="docs-dark"] .hero, [data-mode="docs-light"] .hero { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .primary { background: var(--action); color: #202020; }
  [data-mode="docs-dark"] .primary, [data-mode="docs-light"] .primary { color: #fff; }
  .outline { background: transparent; color: #fff; border: 1px solid #fff; }
  .white { background: #fff; color: #202020; }
  .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .sw { border-radius: 16px; padding: 16px; min-height: 72px; font-size: 12px; font-family: var(--mono); }
  input.field {
    background: #363636; color: #e9e9e9; border: 0; border-radius: 32px;
    padding: 16px 20px; font-family: var(--mono); font-size: 16px; width: 280px;
  }
  .card { background: var(--surface); color: var(--text); border-radius: 16px; padding: 16px; }
  nav button[aria-pressed="true"] { outline: 1px solid #e59700; outline-offset: 1px; }
</style>
</head>
<body>
<header>
  <nav class="row" aria-label="Theme">
    <button type="button" data-theme="marketing" aria-pressed="true">Marketing</button>
    <button type="button" data-theme="docs-dark">Docs dark</button>
    <button type="button" data-theme="docs-light">Docs light</button>
  </nav>
  <div class="hero">
    <p style="font-family:var(--mono);font-size:12px;letter-spacing:.02em">Reown</p>
    <h1>Infrastructure for blockchain app development</h1>
    <p>Measured colours from the public site. KHTeka on marketing, Inter on docs.</p>
    <div class="row">
      <button class="chip primary" type="button">Start building</button>
      <button class="chip outline" type="button">Explore Plans</button>
      <button class="chip white" type="button">Log in</button>
    </div>
  </div>
</header>
<main>
  <h2>Colour</h2>
  <div class="swatch-grid" id="swatches"></div>
  <h2>Field</h2>
  <input class="field" placeholder="Mail" aria-label="Mail" readonly>
  <h2>Type</h2>
  <p style="font-size:16px;line-height:1.5;letter-spacing:-0.01em">Body 16px KHTeka, line-height 1.5, tracking -0.01em.</p>
  <p style="font-family:var(--mono);font-size:16px;letter-spacing:-0.05rem">Button 16px KHTeka Mono, tracking -0.05rem.</p>
</main>
<script>
const colours = [
  ["#9a9a9a", "page"], ["#202020", "surface"], ["#379def", "action"],
  ["#0988f0", "accent"], ["#f4624a", "orange"], ["#18ac65", "green"],
  ["#e9e9e9", "subtle"], ["#6c6c6c", "muted"], ["#008847", "docs green"],
  ["#161a18", "docs ink"], ["#0b0c0e", "code"], ["#e59700", "focus"]
];
const grid = document.getElementById("swatches");
for (const [hex, name] of colours) {
  const el = document.createElement("div");
  el.className = "sw";
  el.style.background = hex;
  el.style.color = hex === "#e9e9e9" || hex === "#e59700" || hex === "#379def" ? "#202020" : "#fff";
  el.textContent = name + " " + hex;
  grid.appendChild(el);
}
document.querySelectorAll("nav button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.documentElement.dataset.mode = btn.dataset.theme;
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
  });
});
</script>
</body>
</html>
