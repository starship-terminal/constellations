<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Obsidian tokens</title>
  <style>
    :root {
      --page: #0f0f0f;
      --text: #eeeeee;
      --muted: #bcbcbc;
      --accent: #7c3aed;
      --on-accent: #ffffff;
      --font: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
      padding: 48px;
    }
    h1 { font-size: 60px; font-weight: 600; line-height: 60px; letter-spacing: -1.2px; margin: 0 0 16px; }
    p { font-size: 36px; line-height: 40px; color: var(--muted); max-width: 36rem; }
    .row { display: flex; gap: 16px; align-items: center; }
    .pill {
      background: var(--accent);
      color: var(--on-accent);
      border-radius: 8px;
      height: 60px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      font-size: 20px;
      font-weight: 500;
    }
    .quiet { color: var(--muted); font-size: 14px; font-weight: 500; }
    .swatches { display: flex; gap: 12px; margin-top: 32px; }
    .swatch { width: 72px; height: 72px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Sharpen your thinking.</h1>
  <p>The free and flexible app for your private thoughts.</p>
  <div class="row">
    <span class="pill">Get Obsidian for macOS</span>
    <span class="quiet">Pricing</span>
  </div>
  <div class="swatches">
    <div class="swatch" style="background:#0f0f0f;border:1px solid #262626"></div>
    <div class="swatch" style="background:#eeeeee"></div>
    <div class="swatch" style="background:#bcbcbc"></div>
    <div class="swatch" style="background:#7c3aed"></div>
  </div>
</body>
</html>
