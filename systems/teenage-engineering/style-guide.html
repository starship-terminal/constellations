<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teenage Engineering style guide</title>
<style>
:root {
  --color-white: #ffffff;
  --color-teWhite: #f5f5f5;
  --color-teBlack: #0f0e12;
  --color-grey100: #e5e5e5;
  --color-grey200: #cccccc;
  --color-grey300: #b2b2b2;
  --color-grey500: #a1a7af;
  --color-grey600: #767676;
  --color-grey700: #7f7f7f;
  --color-grey900: #4d4d4d;
  --color-grey1000: #272727;
  --color-blue: #0071bb;
  --color-green: #006837;
  --color-orange: #f05a24;
  --color-red: #b81d13;
  --color-yellow: #fab413;
  --color-error: #c0262c;
  --color-paper: #f1f2f2;
  --color-success: var(--color-green);
  --font-family-te20: "te-20", "Unicode", sans-serif;
  --font-family-te40: "te-40", "Unicode", sans-serif;
  --font-weight-thin: 100;
  --font-weight-light: 300;
  --font-scale-10: 13.219px;
  --font-scale-15: 19.094px;
  --font-scale-20: 26.438px;
  --font-scale-25: 33.781px;
  --font-scale-30: 39.672px;
  --font-scale-40: 52.891px;
  --font-scale-ui: 16px;
  --space-xs: 7.344px;
  --space-sm: 14.688px;
  --space-md: 22.031px;
  --space-lg: 33.047px;
  --space-xl: 66.109px;
  --radius-none: 0px;
  --radius-field: 0px;
  --radius-tile: 0px;
  --radius-pill: 9999px;
  --border-hairline: 1px;
  --border-checkbox: 2px;
  --size-clickMin: 48px;
  --size-field: 60.016px;
  --size-button: 73.469px;
  --size-icon: 35.25px;
  --size-header: 117.547px;
  --size-checkbox: 29.375px;
  --z-over: 100;
  --z-navigation: 1000;
  --z-modalBackdrop: 2000;
  --z-dialog: 2001;
  --typography-nav: var(--font-weight-thin) var(--font-scale-ui)/15px var(--font-family-te20);
  --typography-body: var(--font-weight-light) var(--font-scale-ui)/22px var(--font-family-te20);
  --typography-field: var(--font-weight-light) var(--font-scale-15)/24px var(--font-family-te20);
  --typography-button: var(--font-weight-light) var(--font-scale-20)/29px var(--font-family-te20);
  --background-page: var(--color-white);
  --background-pageInverse: #000000;
  --background-surface: var(--color-teWhite);
  --background-field: var(--color-white);
  --background-fieldDisabled: #e5e5e5;
  --background-inverse: var(--color-teBlack);
  --text-primary: #000000;
  --text-onInverse: var(--color-teWhite);
  --text-onBlack: var(--color-paper);
  --text-muted: #7f7f7f;
  --text-disabled: #b2b2b2;
  --text-link: #000000;
  --border-default: #000000;
  --border-muted: #e5e5e5;
  --border-fieldMuted: #e5e5e5;
  --border-focus: #000000;
  --border-select: #767676;
  --action-primary: var(--color-teBlack);
  --action-primaryText: var(--color-teWhite);
  --action-soldOut: var(--color-teBlack);
  --status-success: var(--color-success);
  --status-error: var(--color-error);
  --status-info: var(--color-blue);
  --status-warning: var(--color-yellow);
  --focus-ring: #000000;
  color-scheme: light;
  --sg-sans: "te-20", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --sg-mono: ui-monospace, Menlo, Consolas, monospace;
}
[data-mode="dark"] {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--background-page); color: var(--text-primary); font: 300 16px/22px var(--sg-sans); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
header.top { border-bottom: 1px solid var(--border-muted); margin-bottom: 32px; }
header.top h1 { font-weight: 100; font-size: 28px; margin: 0 0 8px; }
p.lead { max-width: 70ch; color: var(--text-primary); }
h2 { font-weight: 100; font-size: 26px; margin: 40px 0 12px; }
h3 { font-weight: 300; font-size: 16px; margin: 24px 0 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 12px; }
.sw { width: 140px; }
.sw i { display: block; height: 64px; border: 1px solid var(--border-muted); }
.sw b, .sw span { display: block; font-size: 12px; font-weight: 300; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: var(--size-button); min-width: 220px; padding: 0 24px; background: var(--action-primary); color: var(--action-primaryText); border: 0; font: 300 var(--font-scale-20)/29px var(--sg-sans); }
.fld { display: block; width: min(480px, 100%); height: var(--size-field); border: var(--border-hairline) solid var(--border-default); background: var(--background-field); color: var(--text-primary); font: 300 var(--font-scale-15)/24px var(--sg-sans); padding: 0 12px; }
.tile { width: 220px; height: 140px; background: var(--background-surface); }
.ink { background: var(--background-pageInverse); color: var(--text-onBlack); padding: 16px; }
.ink a { color: var(--text-onBlack); text-decoration: none; font-weight: 100; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-muted); font-weight: 300; }
code { font-family: var(--sg-mono); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>teenage engineering</h1>
  <p class="lead">Public store, measured 2026-11-21. One theme. The home page is black. The store and forms are white. Values come from tokens.json.</p>
</header>
<section>
  <h2>Colour</h2>
  <div class="swatches" id="swatches"></div>
</section>
<section>
  <h2>Type</h2>
  <p style="font-weight:100;font-size:var(--font-scale-ui)">nav, weight 100, 16px at 1440</p>
  <p style="font-weight:300;font-size:var(--font-scale-15)">field, weight 300</p>
  <p style="font-weight:300;font-size:var(--font-scale-20)">button, weight 300</p>
</section>
<section>
  <h2>Controls</h2>
  <p><button class="btn" type="button">subscribe</button></p>
  <p><input class="fld" placeholder="email" readonly></p>
  <div class="tile"></div>
  <div class="ink"><a href="#">store</a></div>
</section>
<section>
  <h2>Space</h2>
  <p>xs <span id="xs"></span> · sm <span id="sm"></span> · md <span id="md"></span> · lg <span id="lg"></span> · xl <span id="xl"></span></p>
</section>
</div>
