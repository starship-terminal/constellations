<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Statuspage public tokens</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 32px; color: #292a2e; background: #fff; }
    h1 { font-weight: 650; font-size: 2rem; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .swatch { width: 148px; }
    .chip { height: 72px; border-radius: 8px; border: 1px solid #0b120e24; }
    p { margin: 8px 0; font-size: 0.875rem; }
  </style>
</head>
<body>
  <h1>Statuspage</h1>
  <p>Declared light tokens from the Statuspage marketing page, 22 November 2026. Read values from tokens.json.</p>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#ffffff"></div><p>surface #ffffff</p></div>
    <div class="swatch"><div class="chip" style="background:#101214"></div><p>hero #101214</p></div>
    <div class="swatch"><div class="chip" style="background:#292a2e"></div><p>text #292a2e</p></div>
    <div class="swatch"><div class="chip" style="background:#505258"></div><p>subtle #505258</p></div>
    <div class="swatch"><div class="chip" style="background:#1868db"></div><p>brand #1868db</p></div>
    <div class="swatch"><div class="chip" style="background:#1558bc"></div><p>brand hover #1558bc</p></div>
    <div class="swatch"><div class="chip" style="background:#c9372c"></div><p>danger #c9372c</p></div>
    <div class="swatch"><div class="chip" style="background:#fbc828"></div><p>warning #fbc828</p></div>
    <div class="swatch"><div class="chip" style="background:#5b7f24"></div><p>success #5b7f24</p></div>
  </div>
</body>
</html>
