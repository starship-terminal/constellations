<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedestal style guide</title>
<style>
/* Generated by tools/build/build_style_guide.py from tokens.json. Edit the template or the tokens. */
:root {
  --font-family-display: FK Display, Helvetica, Arial, sans-serif;
  --font-family-sans: Suisse Intl, Helvetica, Arial, sans-serif;
  --typography-display-4xl: 400 160px/160px var(--font-family-display);
  --typography-display-2xl: 400 56px/56px var(--font-family-display);
  --typography-display-xl: 400 32px/32px var(--font-family-display);
  --typography-title-s: 400 19px/22.8px var(--font-family-sans);
  --typography-title-s-bold: 500 19px/22.8px var(--font-family-sans);
  --typography-body: 400 15px/22.5px var(--font-family-sans);
  --typography-cta: 500 15px/18px var(--font-family-sans);
  --typography-label: 400 16px/19.2px var(--font-family-sans);
  --typography-small: 400 13px/18.2px var(--font-family-sans);
  --typography-eyebrow: 400 13px/19.5px var(--font-family-sans);
  --typography-caption: 600 11px/15.4px var(--font-family-sans);
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-chip: 9999px;
  --spacing-0-5: 2px;
  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-2-5: 10px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-6: 24px;
  --spacing-10: 40px;
  --spacing-header: 48px;
  --spacing-field: 74px;
  --spacing-control: 56px;
  --motion-duration-150: 150ms;
  --motion-duration-300: 300ms;
  --motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --motion-easing-out: cubic-bezier(0, 0, 0.2, 1);
  --background-page: #fafafa;
  --background-surface: #f5f5f5;
  --background-sunken: rgba(33, 33, 33, 0.05);
  --background-muted: #eaeaea;
  --background-inverse: #212121;
  --background-action: #0a4afd;
  --background-action-hover: #0d38ad;
  --background-inverse-hover: #111111;
  --text-primary: #212121;
  --text-secondary: rgba(33, 33, 33, 0.65);
  --text-muted: rgba(33, 33, 33, 0.45);
  --text-grey: #606060;
  --text-on-action: #ffffff;
  --text-on-inverse: #ffffff;
  --text-on-hero: #ffffff;
  --text-accent: #0a4afd;
  --text-error: #ff4747;
  --border-default: rgba(33, 33, 33, 0.2);
  --border-subtle: rgba(33, 33, 33, 0.1);
  --border-strong: #212121;
  --focus-outline: #e59700;
  --component-button-primary-background: var(--background-action);
  --component-button-primary-text: var(--text-on-action);
  --component-button-primary-radius: var(--radius-md);
  --component-button-primary-height: var(--spacing-field);
  --component-button-ink-background: var(--background-inverse);
  --component-button-ink-text: var(--text-on-inverse);
  --component-button-ink-radius: var(--radius-md);
  --component-button-ink-height: var(--spacing-field);
  --component-button-ink-padding: var(--spacing-1);
  --component-field-background: var(--background-sunken);
  --component-field-text: var(--text-primary);
  --component-field-radius: var(--radius-md);
  --component-field-height: var(--spacing-field);
  --component-nav-text: var(--text-on-hero);
  --component-nav-radius: var(--radius-sm);
  --component-nav-height: 32px;
  color-scheme: light;
  --sg-sans: "Suisse Intl", Helvetica, Arial, sans-serif;
  --sg-display: "FK Display", Helvetica, Arial, sans-serif;
  --page: var(--background-page);
  --ink: var(--text-primary);
  --line: var(--border-default);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 400 15px/22.5px var(--sg-sans); }
.wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font: 400 56px/56px var(--sg-display); letter-spacing: -2.24px; margin: 0 0 8px; }
h2 { font: 400 32px/32px var(--sg-display); letter-spacing: -1.28px; margin: 40px 0 12px; }
p.lead { max-width: 62ch; color: var(--text-secondary); }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.swatch { width: 140px; }
.swatch i { display: block; height: 64px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line); }
.swatch span { display: block; margin-top: 6px; font-size: 12px; line-height: 16px; }
.btn { display: inline-flex; align-items: center; height: var(--component-button-primary-height); padding: 0 16px; border: 0; border-radius: var(--component-button-primary-radius); background: var(--component-button-primary-background); color: var(--component-button-primary-text); font: 500 15px/18px var(--sg-sans); letter-spacing: -0.15px; }
.btn.ink { background: var(--component-button-ink-background); color: var(--component-button-ink-text); border-radius: var(--component-button-ink-radius); }
.field { height: var(--component-field-height); width: 280px; border: 0; border-radius: var(--component-field-radius); background: var(--component-field-background); color: var(--component-field-text); padding: 0 12px; font: 400 16px/19.2px var(--sg-sans); }
.chip { width: 24px; height: 24px; border-radius: var(--radius-chip); background: var(--background-inverse); }
.nav { display: inline-flex; align-items: center; height: var(--component-nav-height); padding: 5px 10px 4px; border-radius: var(--component-nav-radius); background: var(--background-sunken); color: var(--ink); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pedestal</h1>
  <p class="lead">Light storefront tokens from www.pedestal.com, 2026-11-19. FK Display and Suisse Intl are not loaded here, so the stacks fall back to Helvetica.</p>
  <h2>Colour</h2>
  <div class="row">
    <div class="swatch"><i style="background: var(--background-page)"></i><span>page</span></div>
    <div class="swatch"><i style="background: var(--background-surface)"></i><span>surface</span></div>
    <div class="swatch"><i style="background: var(--background-sunken)"></i><span>sunken</span></div>
    <div class="swatch"><i style="background: var(--background-muted)"></i><span>muted</span></div>
    <div class="swatch"><i style="background: var(--background-inverse)"></i><span>inverse</span></div>
    <div class="swatch"><i style="background: var(--background-action)"></i><span>action</span></div>
    <div class="swatch"><i style="background: var(--text-primary)"></i><span>text</span></div>
    <div class="swatch"><i style="background: var(--text-secondary)"></i><span>secondary</span></div>
    <div class="swatch"><i style="background: var(--border-default)"></i><span>border</span></div>
    <div class="swatch"><i style="background: var(--focus-outline)"></i><span>focus</span></div>
  </div>
  <h2>Controls</h2>
  <div class="row">
    <button class="btn">Add to cart</button>
    <button class="btn ink">Send</button>
    <span class="nav">Configure</span>
    <input class="field" placeholder="Name" aria-label="Name">
    <i class="chip"></i>
  </div>
  <h2>Type</h2>
  <p style="font: 400 32px/32px var(--sg-display); letter-spacing: -1.28px; margin: 0;">Viva</p>
  <p style="font: 400 19px/22.8px var(--sg-sans); letter-spacing: -0.38px;">Your cart is empty</p>
  <p style="font: 400 13px/19.5px var(--sg-sans); letter-spacing: 0.65px; text-transform: uppercase; color: var(--text-secondary);">Featured</p>
</div>
</body>
</html>
