<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PostHog public tokens</title>
  <style>
    :root {
      --page: #eeefe9;
      --text: #111827;
      --nav: #23251d;
      --accent: #cd8407;
      --accent-border: #b17816;
      --link: #2f80fa;
    }
    body { margin: 0; background: var(--page); color: var(--text); font: 16px/24px ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 36px; line-height: 40px; letter-spacing: -0.9px; font-weight: 800; margin: 0 0 8px; }
    h1 span { color: var(--link); background: rgba(47, 128, 250, 0.1); border-radius: 6px; padding: 0 4px; }
    p { color: var(--nav); }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 24px; }
    .swatch { border-radius: 8px; overflow: hidden; background: #fff; }
    .chip { height: 72px; }
    .label { padding: 8px 10px; font-size: 13px; }
    .btn { display: inline-block; margin-top: 24px; background: var(--accent); color: var(--nav); border: 1px solid var(--accent-border); border-radius: 6px; padding: 4px 12px; height: 32px; line-height: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Your product's <span>context layer</span></h1>
    <p>Public homepage, signed out, 2026-11-22. catalog.json was left alone, so this file is a hand swatch, not a generated guide.</p>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#eeefe9"></div><div class="label">Page #eeefe9</div></div>
      <div class="swatch"><div class="chip" style="background:#111827"></div><div class="label">Heading #111827</div></div>
      <div class="swatch"><div class="chip" style="background:#23251d"></div><div class="label">Nav #23251d</div></div>
      <div class="swatch"><div class="chip" style="background:#cd8407"></div><div class="label">Accent #cd8407</div></div>
      <div class="swatch"><div class="chip" style="background:#b17816"></div><div class="label">Accent border #b17816</div></div>
      <div class="swatch"><div class="chip" style="background:#2f80fa"></div><div class="label">Highlight #2f80fa</div></div>
      <div class="swatch"><div class="chip" style="background:#f3f4f0"></div><div class="label">Wall #f3f4f0</div></div>
    </div>
    <div class="btn">Get started – free</div>
  </main>
</body>
</html>
