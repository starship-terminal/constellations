<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Zed public tokens</title>
  <style>
    :root { color-scheme: dark; background: #141519; color: #d5d6d8; font: 16px/1.5 Georgia, serif; }
    body { margin: 32px; max-width: 720px; }
    h1 { font-weight: 400; font-size: 32px; }
    .row { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
    .swatch { width: 48px; height: 48px; border-radius: 4px; }
    button { font: 14px/20px sans-serif; border-radius: 4px; padding: 8px 12px; }
    .primary { background: #1348dc; color: #fff; border: 1px solid transparent; }
    .quiet { background: rgba(255,255,255,0.05); color: #e8e8ea; border: 1px solid rgba(255,255,255,0.2); }
    .footer { background: #164adc; color: #fff; padding: 16px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Zed public tokens</h1>
  <p>Hand-written from the 2026-11-22 readings. Not a generated guide.</p>
  <div class="row"><div class="swatch" style="background:#141519;border:1px solid #333"></div><span>Dark page #141519</span></div>
  <div class="row"><div class="swatch" style="background:#f4f4f2"></div><span>Light page #f4f4f2</span></div>
  <div class="row"><div class="swatch" style="background:#1348dc"></div><span>Download now #1348dc</span></div>
  <div class="row"><div class="swatch" style="background:#164adc"></div><span>Footer band #164adc</span></div>
  <div class="row"><div class="swatch" style="background:#1e69f6"></div><span>Declared motif accent #1e69f6</span></div>
  <p><button class="primary">Download now</button> <button class="quiet">Clone source</button></p>
  <div class="footer">Zed Industries footer band</div>
</body>
</html>
