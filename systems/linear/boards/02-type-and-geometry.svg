<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><title>Typography &amp; geometry</title><rect x="0" y="0" width="1200" height="870" rx="0" fill="#08090A" stroke="none"/><text x="40" y="53" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#8A8F98">LINEAR / STYLE REFERENCE</text><text x="40" y="103" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="510" fill="#F7F8F8">Typography &amp; geometry</text><text x="40" y="135" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A8F98">Three measured font families. App geometry is reconstructed at logical pixel scale.</text><text x="40" y="209" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="510" fill="#F7F8F8">Inter Variable</text><text x="42" y="243" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8A8F98">UI / navigation / product examples / marketing</text><text x="40" y="327" font-family="Berkeley Mono, Menlo, monospace" font-size="40" font-weight="400" fill="#D0D6E0">Berkeley Mono</text><text x="42" y="365" font-family="Menlo, monospace" font-size="12" font-weight="400" fill="#8A8F98">CODE / NUMBERS / TECHNICAL ANNOTATIONS</text><text x="40" y="460" font-family="Tiempos Headline, Georgia, serif" font-size="58" font-weight="400" fill="#F7F8F8">Tiempos Headline</text><text x="42" y="500" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#8A8F98">Editorial exception: Linear Method. Install licensed face for fidelity.</text><text x="650" y="216" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="510" fill="#F7F8F8">Hero / 64 · 510 · 64</text><text x="650" y="294" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="510" fill="#F7F8F8">Section / 48 · 510 · 48</text><text x="650" y="372" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="590" fill="#F7F8F8">Issue / 20 · 590 · 26.6</text><text x="650" y="450" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F7F8F8">Body / 14 · 400 · 21</text><text x="650" y="528" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="510" fill="#F7F8F8">Navigation / 13 · 510</text><text x="650" y="606" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#F7F8F8">Metadata / 12 · 400</text><text x="40" y="585" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#D0D6E0">Public Inter features: cv01 + ss03. Variable weights: 400, 510, 590.</text><text x="40" y="620" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#8A8F98">Authenticated code preferences: 12px, Regular, Default. Exact code family unverified.</text><rect x="40" y="700" width="136" height="84" rx="4" fill="#1A1A1C" stroke="#3A3A3E"/><text x="40" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 4</text><rect x="215" y="700" width="136" height="84" rx="6" fill="#1A1A1C" stroke="#3A3A3E"/><text x="215" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 6</text><rect x="390" y="700" width="136" height="84" rx="8" fill="#1A1A1C" stroke="#3A3A3E"/><text x="390" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 8</text><rect x="565" y="700" width="136" height="84" rx="12" fill="#1A1A1C" stroke="#3A3A3E"/><text x="565" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 12</text><rect x="740" y="700" width="136" height="84" rx="16" fill="#1A1A1C" stroke="#3A3A3E"/><text x="740" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 16</text><rect x="915" y="700" width="136" height="84" rx="42" fill="#1A1A1C" stroke="#3A3A3E"/><text x="915" y="814" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#D0D6E0">Radius 9999</text></svg>