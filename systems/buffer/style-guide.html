<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<title>Buffer style guide</title>
<style>
:root {
  --font-body: Figtree, ui-sans-serif, system-ui, sans-serif;
  --font-display: Stolzl, ui-sans-serif, system-ui, sans-serif;
  --fontSize-hero: 75.8px;
  --fontSize-body: 18px;
  --fontSize-nav: 18px;
  --radius-pill: 1440px;
  --spacing-field-x: 27px;
  --spacing-field-y: 18px;
  --page: #fefdfb;
  --surface: #ffffff;
  --text: #213130;
  --muted: #6e6e68;
  --accent: #b0ec9c;
  --border-field: #6e6e68;
  --footer: #213130;
  --on-accent: #213130;
  --shadow-field: 0 4px 12px -2px rgba(23, 23, 23, 0.1), 0 0 1px 1px rgba(23, 23, 23, 0.05);
  font-family: var(--font-body);
  background: var(--page);
  color: var(--text);
}
body { margin: 32px; }
.swatch { display: inline-block; width: 88px; height: 56px; border-radius: 8px; border: 1px solid var(--border-field); margin-right: 8px; }
.pill { display: inline-block; background: var(--accent); color: var(--on-accent); border-radius: var(--radius-pill); padding: 12px 20px; }
h1 { font-family: var(--font-display); font-size: 48px; font-weight: 400; letter-spacing: -1px; }
</style>
</head>
<body>
<h1>Buffer</h1>
<p>Public marketing tokens, light only.</p>
<div>
  <span class="swatch" style="background: var(--page)"></span>
  <span class="swatch" style="background: var(--surface)"></span>
  <span class="swatch" style="background: var(--text)"></span>
  <span class="swatch" style="background: var(--muted)"></span>
  <span class="swatch" style="background: var(--accent)"></span>
  <span class="swatch" style="background: var(--footer)"></span>
</div>
<p class="pill">Get started for free</p>
</body>
</html>
