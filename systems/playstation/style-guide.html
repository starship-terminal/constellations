<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlayStation style guide</title>
<style>
:root {
  --color-white: #ffffff;
  --color-ink: #121314;
  --color-blue: #0068bd;
  --color-blueBright: #53b1ff;
  --color-navy: #003697;
  --color-orange: #d53b00;
  --color-orangeDark: #d63d00;
  --color-gold: #fcc71d;
  --color-green: #007a62;
  --color-red: #c81b3a;
  --color-pink: #cb2070;
  --color-grey: #6b6b6b;
  --font-family-sst: sst, Arial, sans-serif;
  --font-family-condensed: "sst condensed", "sst", Arial, sans-serif;
  --font-weight-light: 300;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-bold: 700;
  --space-1: 2px;
  --space-2: 4px;
  --space-3: 8px;
  --space-4: 12px;
  --space-5: 16px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 40px;
  --space-9: 48px;
  --space-10: 64px;
  --space-11: 80px;
  --space-12: 128px;
  --space-13: 256px;
  --radius-0: 2px;
  --radius-1: 4px;
  --radius-2: 8px;
  --radius-3: 16px;
  --radius-4: 32px;
  --radiusPill: 999px;
  --fontSize-1: 10px;
  --fontSize-2: 12px;
  --fontSize-3: 14px;
  --fontSize-4: 16px;
  --fontSize-5: 20px;
  --fontSize-6: 25px;
  --fontSize-7: 31px;
  --fontSize-8: 39px;
  --fontSize-9: 49px;
  --fontSize-10: 61px;
  --fontSize-11: 76px;
  --size-header: 64px;
  --size-signIn: 24px;
  --size-commerce: 44px;
  --size-addToCart: 40px;
  --size-navLabel: 13px;
  --typography-display: var(--font-weight-light) var(--fontSize-8)/48.75px var(--font-family-sst);
  --typography-body: var(--font-weight-regular) var(--fontSize-4)/24px var(--font-family-sst);
  --typography-nav: var(--font-weight-medium) 13px/16px var(--font-family-sst);
  --typography-button: var(--font-weight-bold) var(--fontSize-4)/20px var(--font-family-sst);
  --page: #ffffff;
  --surface: #f5f7fa;
  --raised: #ebeef0;
  --card: rgba(255, 255, 255, 0.97);
  --overlay: rgba(255, 255, 255, 0.97);
  --scrim: rgba(245, 247, 250, 0.3);
  --text: #000000;
  --muted: #6b6b6b;
  --disabled: #d2d4d9;
  --onAccent: #ffffff;
  --link: #0068bd;
  --linkHover: #005daa;
  --placeholder: rgba(0, 0, 0, 0.6);
  --border: #f3f3f3;
  --borderStrong: rgba(0, 112, 204, 0.5);
  --accent: #0070cc;
  --accentHover: #0064b7;
  --accentPressed: #0059a3;
  --commerce: #d53b00;
  --commerceHover: #c03500;
  --commercePressed: #aa2f00;
  --success: #007a62;
  --warning: #c81b3a;
  --info: #cb2070;
  --psPlus: #fcc71d;
  --formField: rgba(0, 0, 0, 0.06);
  --focus: #0064b7;
  --signIn: #0070cc;
  --signInHover: #005499;
  --navHover: #0070d1;
  --addToCart: #d63d00;
  --addToCartHover: #a32e00;
  --textBody: #1f1f1f;
  --storeText: #363636;
  --footer: #00439c;
  --tabSelected: #ebeef0;
  color-scheme: light;
  --sg-sans: sst, Arial, Helvetica, sans-serif;
}
[data-mode="dark"] {
  --page: #121314;
  --surface: #090a0a;
  --raised: #000000;
  --card: rgba(31, 32, 36, 0.97);
  --overlay: rgba(18, 19, 20, 0.8);
  --scrim: rgba(9, 10, 10, 0.3);
  --text: #ffffff;
  --muted: #b2b2b2;
  --disabled: #2c2d33;
  --onAccent: #000000;
  --link: #53b1ff;
  --linkHover: #31a1ff;
  --placeholder: rgba(255, 255, 255, 0.6);
  --border: rgba(255, 255, 255, 0.08);
  --borderStrong: rgba(255, 255, 255, 0.5);
  --accent: #ffffff;
  --accentHover: #e5e5e5;
  --accentPressed: #cccccc;
  --commerce: #d63d00;
  --commerceHover: #c03500;
  --commercePressed: #aa2f00;
  --success: #009476;
  --warning: #ff143f;
  --info: #d94a8d;
  --psPlus: #fcc71d;
  --formField: rgba(255, 255, 255, 0.08);
  --focus: #e5e5e5;
  color-scheme: dark;
  --page: var(--page);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 400 16px/24px var(--sg-sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 80px; }
h1 { font-weight: 300; font-size: 39px; line-height: 1.25; }
h2 { font-weight: 500; font-size: 20px; margin-top: 40px; }
.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.sw { width: 72px; height: 48px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--signIn); color: #fff; font-weight: 500; font-size: 16px; }
.commerce { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--commerce); color: #fff; font-weight: 700; }
.nav { font-size: 13px; font-weight: 500; color: var(--textBody); }
button.toggle { margin-left: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PlayStation <button class="toggle" type="button" onclick="document.documentElement.dataset.mode=document.documentElement.dataset.mode==='dark'?'':'dark'">Theme</button></h1>
  <p>Values come from tokens.json. SST is not loaded, so type falls back to Arial.</p>
  <h2>Roles</h2>
  <div class="row" id="swatches"></div>
  <h2>Controls</h2>
  <div class="row">
    <span class="pill">Sign In</span>
    <span class="commerce">Add to Cart</span>
    <span class="nav">Games</span>
  </div>
</div>
