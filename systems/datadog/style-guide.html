<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Datadog public tokens</title>
<style>
  body { margin: 24px; font: 16px/1.4 Helvetica, Arial, sans-serif; color: #212529; background: #fff; }
  h1 { font-size: 24px; font-weight: 600; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .swatch { width: 140px; }
  .chip { height: 56px; border-radius: 8px; border: 1px solid #e6e6e6; }
  .label { font-size: 12px; margin-top: 4px; }
  .btn { display: inline-flex; align-items: center; height: 54px; padding: 0 24px; border-radius: 4px; background: #632ca6; color: #fff; font-weight: 700; font-size: 18px; }
  .quiet { display: inline-flex; align-items: center; height: 54px; padding: 0 24px; border-radius: 4px; background: #fff; color: #632ca6; border: 1px solid #632ca6; font-weight: 700; font-size: 18px; margin-left: 12px; }
</style>
</head>
<body>
<h1>Datadog, public light</h1>
<p>Declared colours from the homepage, 2026-11-22. catalog.json was left alone.</p>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#FFFFFF"></div><div class="label">page #FFFFFF</div></div>
  <div class="swatch"><div class="chip" style="background:#212529"></div><div class="label">text #212529</div></div>
  <div class="swatch"><div class="chip" style="background:#555555"></div><div class="label">muted #555555</div></div>
  <div class="swatch"><div class="chip" style="background:#632CA6"></div><div class="label">accent #632CA6</div></div>
  <div class="swatch"><div class="chip" style="background:#BEAAFF"></div><div class="label">soft #BEAAFF</div></div>
  <div class="swatch"><div class="chip" style="background:#D9534F"></div><div class="label">danger #D9534F</div></div>
  <div class="swatch"><div class="chip" style="background:#F0AD4E"></div><div class="label">warning #F0AD4E</div></div>
  <div class="swatch"><div class="chip" style="background:#5CB85C"></div><div class="label">success #5CB85C</div></div>
  <div class="swatch"><div class="chip" style="background:#3399CC"></div><div class="label">info #3399CC</div></div>
</div>
<p><span class="btn">Free trial</span><span class="quiet">See the platform</span></p>
</body>
</html>
